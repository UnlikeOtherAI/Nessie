[package]
name = "nessie-desktop"
version = "0.1.0"
description = "Nessie desktop shell"
authors = ["UnlikeOtherAI"]
edition = "2021"

[lib]
name = "nessie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# image-png decodes the bundled overlay-badge dot that Windows shows over the
# taskbar button; every other desktop platform reports unread counts through
# the window badge API instead.
tauri = { version = "2.11.2", features = ["image-png"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
# The deep-link feature hands a second launch's argv URL to the running
# instance's onOpenUrl listeners, which is how the `nessie://` sign-in callback
# reaches an already open app on Windows and Linux.
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }

# Only the Win32 surfaces the executor companion needs: Authenticode
# verification with the signer certificate behind it (the Catalog and Sip
# features are what expose the WTHelper chain readers), and the process handle
# that answers whether a prior daemon is still tearing down.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Threading",
] }
