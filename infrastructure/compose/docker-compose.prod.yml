# Nessie production stack (self-hosted, Hetzner).
#
# Reuses the shared edge proxy (Caddy) and joins the shared `edge`/`db` Docker
# networks created by /srv/infra. Postgres is NOT shared: Nessie needs the
# pgvector extension, which the shared postgres:17-alpine image lacks, so it runs
# its own pgvector container on the `db` network. Queue + realtime are
# Postgres-backed (PgQueueProvider / PgRealtimeTransport), so no Redis is needed.
#
# Build context is the repo root (../..). Run from the repo root on the server:
#   docker compose -f infrastructure/compose/docker-compose.prod.yml up -d --build
services:
  # IMPORTANT: the service name becomes a DNS alias on the shared `db` network.
  # It MUST NOT be `postgres`, or it collides with the shared postgres container
  # and `postgres:5432` round-robins between two databases, breaking every other
  # app on the host. Keep this named `nessie-postgres` and pin the alias.
  nessie-postgres:
    image: pgvector/pgvector:pg17
    container_name: nessie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: ${NESSIE_DB_PASSWORD}
      POSTGRES_DB: nessie
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nessie_pgdata:/var/lib/postgresql/data
    networks:
      db:
        aliases:
          - nessie-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for file uploads / KB file nodes + attachments.
  # The shared host has no S3, so Nessie runs its own MinIO on the `db` network.
  nessie-minio:
    image: minio/minio:latest
    container_name: nessie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - nessie_miniodata:/data
    networks:
      db:
        aliases:
          - nessie-minio
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: create the bucket on (re)deploy, then exit.
  nessie-minio-setup:
    image: minio/mc:latest
    container_name: nessie-minio-setup
    depends_on:
      - nessie-minio
    environment:
      MINIO_ROOT_USER: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
      NESSIE_STORAGE_BUCKET: ${NESSIE_STORAGE_BUCKET:-nessie}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://nessie-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing "local/$$NESSIE_STORAGE_BUCKET";
    networks:
      - db
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.app
    image: nessie-app:latest
    container_name: nessie-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NESSIE_MODE: selfHosted
      NESSIE_API_HOST: 0.0.0.0
      NESSIE_API_PORT: "5554"
      NESSIE_API_TRUSTED_PROXY_HOPS: "1"
      DATABASE_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_DB_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_CONFIG_PATH: /app/nessie.config.json
      NESSIE_CORS_ORIGINS: https://app.nessie.works,https://nessie.unlikeotherai.com
      # Object storage (MinIO).
      NESSIE_STORAGE_PROVIDER: s3
      NESSIE_STORAGE_ENDPOINT: http://nessie-minio:9000
      NESSIE_STORAGE_REGION: us-east-1
      NESSIE_STORAGE_FORCE_PATH_STYLE: "true"
      NESSIE_STORAGE_BUCKET: ${NESSIE_STORAGE_BUCKET:-nessie}
      NESSIE_STORAGE_ACCESS_KEY_ID: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      NESSIE_STORAGE_SECRET_ACCESS_KEY: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
      NESSIE_MAX_UPLOAD_BYTES: "5368709120"
    volumes:
      - ./nessie.config.json:/app/nessie.config.json:ro
    networks:
      - edge
      - db
    depends_on:
      nessie-postgres:
        condition: service_healthy
      nessie-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5554/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: nessie-app:latest
    container_name: nessie-worker
    restart: unless-stopped
    command: ["node", "worker/dist/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NESSIE_MODE: selfHosted
      DATABASE_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_DB_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_CONFIG_PATH: /app/nessie.config.json
      # Object storage (MinIO) — must match the api service.
      NESSIE_STORAGE_PROVIDER: s3
      NESSIE_STORAGE_ENDPOINT: http://nessie-minio:9000
      NESSIE_STORAGE_REGION: us-east-1
      NESSIE_STORAGE_FORCE_PATH_STYLE: "true"
      NESSIE_STORAGE_BUCKET: ${NESSIE_STORAGE_BUCKET:-nessie}
      NESSIE_STORAGE_ACCESS_KEY_ID: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      NESSIE_STORAGE_SECRET_ACCESS_KEY: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
      NESSIE_MAX_UPLOAD_BYTES: "5368709120"
    volumes:
      - ./nessie.config.json:/app/nessie.config.json:ro
    networks:
      - db
    depends_on:
      nessie-postgres:
        condition: service_healthy
      nessie-minio:
        condition: service_healthy
      api:
        condition: service_started

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
      args:
        VITE_API_BASE_URL: https://api.nessie.works
    image: nessie-admin:latest
    container_name: nessie-admin
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    image: nessie-web:latest
    container_name: nessie-web
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  nessie-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.gateway
    image: nessie-gateway:latest
    container_name: nessie-gateway
    profiles: ["push"]
    restart: unless-stopped
    env_file:
      # Loads GATEWAY_API_KEY, PUSH_APNS_*, and PUSH_FCM_SERVICE_ACCOUNT from
      # the host-only .env file when the push profile is enabled.
      - .env
    environment:
      NODE_ENV: production
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "5556"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5556/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nessie_pgdata:
  nessie_miniodata:

networks:
  edge:
    external: true
  db:
    external: true
