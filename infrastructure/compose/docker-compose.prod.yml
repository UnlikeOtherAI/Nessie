# Nessie production stack (self-hosted, Hetzner).
#
# Reuses the shared edge proxy (Caddy) and joins the shared `edge`/`db` Docker
# networks created by /srv/infra. Postgres is NOT shared: Nessie needs the
# pgvector extension, which the shared postgres:17-alpine image lacks, so it runs
# its own pgvector container on the `db` network. Queue + realtime are
# Postgres-backed (PgQueueProvider / PgRealtimeTransport), so no Redis is needed.
#
# Build context is the repo root (../..). Run from the repo root on the server:
#   docker compose -f infrastructure/compose/docker-compose.prod.yml up -d --build
services:
  # IMPORTANT: the service name becomes a DNS alias on the shared `db` network.
  # It MUST NOT be `postgres`, or it collides with the shared postgres container
  # and `postgres:5432` round-robins between two databases, breaking every other
  # app on the host. Keep this named `nessie-postgres` and pin the alias.
  nessie-postgres:
    image: pgvector/pgvector:pg17
    container_name: nessie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: ${NESSIE_DB_PASSWORD}
      POSTGRES_DB: nessie
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nessie_pgdata:/var/lib/postgresql/data
    networks:
      db:
        aliases:
          - nessie-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for file uploads / KB file nodes + attachments.
  # The shared host has no S3, so Nessie runs its own MinIO on the `db` network.
  nessie-minio:
    image: minio/minio:latest
    container_name: nessie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - nessie_miniodata:/data
    networks:
      db:
        aliases:
          - nessie-minio
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: create the bucket on (re)deploy, then exit.
  nessie-minio-setup:
    image: minio/mc:latest
    container_name: nessie-minio-setup
    depends_on:
      - nessie-minio
    environment:
      MINIO_ROOT_USER: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
      NESSIE_STORAGE_BUCKET: ${NESSIE_STORAGE_BUCKET:-nessie}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://nessie-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing "local/$$NESSIE_STORAGE_BUCKET";
    networks:
      - db
    restart: "no"

  # Infisical persists in a dedicated database on Nessie's existing pgvector
  # cluster. It is not exposed on a host port: the shared Caddy proxy is its
  # sole ingress and Postgres/Redis remain private to Docker networks.
  nessie-infisical-redis:
    image: redis:7.4-alpine
    container_name: nessie-infisical-redis
    profiles: ["secrets"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nessie_infisical_redisdata:/data
    networks:
      vault:
        aliases:
          - nessie-infisical-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical:
    image: ${INFISICAL_IMAGE:-infisical/infisical:v0.151.0-postgres}
    container_name: nessie-infisical
    profiles: ["secrets"]
    restart: unless-stopped
    env_file:
      # Vault bootstrap/database keys are intentionally isolated from the
      # Nessie runtime .env. The API and worker must never inherit them.
      - .env.infisical
    environment:
      REDIS_URL: redis://nessie-infisical-redis:6379
      SITE_URL: https://vault.nessie.works
    depends_on:
      nessie-postgres:
        condition: service_healthy
      nessie-infisical-redis:
        condition: service_healthy
    networks:
      - edge
      - vault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.app
    image: nessie-app:latest
    container_name: nessie-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NESSIE_MODE: selfHosted
      NESSIE_API_HOST: 0.0.0.0
      NESSIE_API_PORT: "5554"
      NESSIE_API_TRUSTED_PROXY_HOPS: "1"
      # Public origin for OAuth redirect URIs minted outside an HTTP request
      # (the worker's personal assistant connector_authorize flow).
      NESSIE_API_PUBLIC_URL: https://api.nessie.works
      NESSIE_ADMIN_PUBLIC_URL: https://app.nessie.works
      # Embeddings do not follow chat. Chat runs on Ledger's DeepSeek adapter,
      # which answers `403 embeddings is not allowed for deepseek`, so the
      # embedding destination is named separately: same Ledger host and same
      # LEDGER/NESSIE_MODEL_API_KEY credential (inherited from the chat
      # provider), but the `/v1/jina` service segment. Without these, memory
      # recall and kb_search silently degrade to lexical-only on every run.
      NESSIE_EMBEDDING_PROVIDER: openai-compatible
      NESSIE_EMBEDDING_SERVICE_ID: jina
      NESSIE_EMBEDDING_MODEL: jina-embeddings-v3
      # Agent-avatar "Generate with AI" routes through this Ledger Purpose API
      # (Gemini image primary, OpenAI gpt-image-2 fallback), so the exhausted
      # OpenAI image key no longer 503s avatar generation. See docs/deployment.md.
      NESSIE_LEDGER_IMAGE_PURPOSE_API_ID: pa_dd11af80_25a7
      UOA_BASE_URL: https://authentication.unlikeotherai.com
      DATABASE_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_DB_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_CONFIG_PATH: /app/nessie.config.json
      NESSIE_CORS_ORIGINS: https://app.nessie.works,https://nessie.unlikeotherai.com
      # Object storage (MinIO).
      NESSIE_STORAGE_PROVIDER: s3
      NESSIE_STORAGE_ENDPOINT: http://nessie-minio:9000
      NESSIE_STORAGE_REGION: us-east-1
      NESSIE_STORAGE_FORCE_PATH_STYLE: "true"
      NESSIE_STORAGE_BUCKET: ${NESSIE_STORAGE_BUCKET:-nessie}
      NESSIE_STORAGE_ACCESS_KEY_ID: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      NESSIE_STORAGE_SECRET_ACCESS_KEY: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
      NESSIE_MAX_UPLOAD_BYTES: "5368709120"
      # Docker secret mount. The host path stays in `.env` solely for Compose's
      # top-level secret declaration and is never inherited by the worker.
      INFISICAL_SERVICE_TOKEN_FILE: /run/secrets/infisical_service_token
    volumes:
      - ./nessie.config.json:/app/nessie.config.json:ro
    secrets:
      - infisical_service_token
    networks:
      - edge
      - db
    depends_on:
      nessie-postgres:
        condition: service_healthy
      nessie-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5554/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: nessie-app:latest
    container_name: nessie-worker
    restart: unless-stopped
    command: ["node", "worker/dist/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NESSIE_MODE: selfHosted
      NESSIE_API_PUBLIC_URL: https://api.nessie.works
      DATABASE_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_DB_URL: postgresql://nessie:${NESSIE_DB_PASSWORD}@nessie-postgres:5432/nessie?schema=public
      NESSIE_CONFIG_PATH: /app/nessie.config.json
      # Object storage (MinIO) — must match the api service.
      NESSIE_STORAGE_PROVIDER: s3
      NESSIE_STORAGE_ENDPOINT: http://nessie-minio:9000
      NESSIE_STORAGE_REGION: us-east-1
      NESSIE_STORAGE_FORCE_PATH_STYLE: "true"
      NESSIE_STORAGE_BUCKET: ${NESSIE_STORAGE_BUCKET:-nessie}
      NESSIE_STORAGE_ACCESS_KEY_ID: ${NESSIE_STORAGE_ACCESS_KEY_ID}
      NESSIE_STORAGE_SECRET_ACCESS_KEY: ${NESSIE_STORAGE_SECRET_ACCESS_KEY}
      NESSIE_MAX_UPLOAD_BYTES: "5368709120"
      # Embeddings do not follow chat. Chat runs on Ledger's DeepSeek adapter,
      # which answers `403 embeddings is not allowed for deepseek`, so the
      # embedding destination is named separately: same Ledger host and same
      # LEDGER/NESSIE_MODEL_API_KEY credential (inherited from the chat
      # provider), but the `/v1/jina` service segment. Without these, memory
      # recall and kb_search silently degrade to lexical-only on every run.
      NESSIE_EMBEDDING_PROVIDER: openai-compatible
      NESSIE_EMBEDDING_SERVICE_ID: jina
      NESSIE_EMBEDDING_MODEL: jina-embeddings-v3
      # Agent-avatar "Generate with AI" routes through this Ledger Purpose API
      # (Gemini image primary, OpenAI gpt-image-2 fallback), so the exhausted
      # OpenAI image key no longer 503s avatar generation. See docs/deployment.md.
      NESSIE_LEDGER_IMAGE_PURPOSE_API_ID: pa_dd11af80_25a7
    volumes:
      - ./nessie.config.json:/app/nessie.config.json:ro
    networks:
      - db
    depends_on:
      nessie-postgres:
        condition: service_healthy
      nessie-minio:
        condition: service_healthy
      api:
        condition: service_started

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
      args:
        VITE_API_BASE_URL: https://api.nessie.works
    image: nessie-admin:latest
    container_name: nessie-admin
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    image: nessie-web:latest
    container_name: nessie-web
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  nessie-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.gateway
    image: nessie-gateway:latest
    container_name: nessie-gateway
    profiles: ["push"]
    restart: unless-stopped
    env_file:
      # Loads GATEWAY_API_KEY, PUSH_APNS_*, and PUSH_FCM_SERVICE_ACCOUNT from
      # the host-only .env file when the push profile is enabled.
      - .env
    environment:
      NODE_ENV: production
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "5556"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5556/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nessie_pgdata:
  nessie_miniodata:
  nessie_infisical_redisdata:

secrets:
  infisical_service_token:
    # Keep ordinary Nessie deploys bootable before the vault is provisioned.
    # A configured production deployment overrides this with the host-only
    # token file; the placeholder is not a credential and the API returns 503
    # until all INFISICAL_* settings are present.
    file: ${INFISICAL_SERVICE_TOKEN_FILE:-./infisical-disabled-token.example}

networks:
  edge:
    external: true
  db:
    external: true
  # Infisical's unauthenticated Redis never joins Nessie's shared data network.
  vault:
    internal: true
