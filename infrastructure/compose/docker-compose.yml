services:
  postgres:
    image: postgres:16-alpine
    container_name: nessie-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nessie}
      POSTGRES_USER: ${POSTGRES_USER:-nessie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nessie}
    volumes:
      - nessie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nessie} -d ${POSTGRES_DB:-nessie}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  nessie-postgres-data:
