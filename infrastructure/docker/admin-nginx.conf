server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security response headers ──────────────────────────────────────────
    # nginx does NOT inherit `add_header` into a location that defines its own,
    # so the document-bearing locations below (/, = /index.html) each repeat the
    # security set. Provider-linked meetings still leave Nessie, so camera and
    # display capture stay denied — but a Personal Assistant voice call captures
    # audio *in* the admin and streams it to Gemini Live, so `microphone=(self)`
    # is required. CSP is Report-Only for now: it surfaces violations without
    # breaking the SPA; promote it to enforcing once the report stream is clean.
    # `connect-src` lists the API origin (REST + WebSocket/SSE) plus Google's
    # Live endpoint, which the browser opens directly because audio flows
    # device<->Google and never through Nessie.
    set $csp_report "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://api.nessie.works wss://api.nessie.works https://api.nessie.unlikeotherai.com wss://api.nessie.unlikeotherai.com wss://generativelanguage.googleapis.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";

    # SPA fallback: every non-asset route resolves to index.html so client-side
    # routing (react-router) works on hard refresh / deep links.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(), fullscreen=(self), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $csp_report always;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(), fullscreen=(self), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $csp_report always;
    }

    # Container healthcheck target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
