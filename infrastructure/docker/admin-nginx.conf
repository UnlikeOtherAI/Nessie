server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security response headers ──────────────────────────────────────────
    # nginx does NOT inherit `add_header` into a location that defines its own,
    # so the document-bearing locations below (/, = /index.html) each repeat the
    # security set. Provider-linked meetings still leave Nessie, so camera and
    # display capture stay denied — but a Personal Assistant voice call captures
    # audio *in* the admin and streams it to Gemini Live, so `microphone=(self)`
    # is required. The CSP is ENFORCING: this origin holds session tokens and
    # renders attacker-supplied email HTML, so it is the one that most needs
    # the policy to actually bite (the marketing site ships the same shape).
    # `script-src 'self'` has no 'unsafe-inline' and no nonce, so the entry
    # document must carry no inline script at all. It gained one anyway — the
    # pre-paint theme/font-scale block of the organisation custom theme — and
    # the policy silently refused it here while dev ran it, so every reload of
    # the web app and of both desktop wrappers painted the bare `:root` palette
    # and repainted in the person's own theme once React mounted. The block now
    # lives in admin/public/boot-theme.js, served from this origin and loaded by
    # a blocking <script src>; admin/test/entry-document-csp.test.ts pins both
    # halves of that arrangement, so the invariant this comment asserts is
    # checked rather than remembered. A build that gains an inline script must
    # lose it again, not gain 'unsafe-inline'.
    # `'wasm-unsafe-eval'` is what lets the spreadsheet start: the IronCalc grid
    # compiles `@ironcalc/wasm/wasm_bg.wasm` with `WebAssembly.instantiateStreaming`
    # (admin/src/components/features/knowledge/spreadsheet/workbook-engine.ts), and
    # under a bare `script-src 'self'` every engine refuses to compile WebAssembly
    # at all — the pane rendered "The spreadsheet engine could not start" on the
    # web app and in both desktop wrappers, which load this same origin. It grants
    # WebAssembly compilation and nothing else; it does NOT re-enable `eval()` on
    # JavaScript, which is why the fix is this token and never 'unsafe-eval'.
    # The wasm itself is a same-origin fingerprinted /assets/ file, so `connect-src
    # 'self'` already covers fetching it.
    # PDF.js reads the already authenticated PDF from a blob: URL, so connect-src
    # includes blob: without opening a new network origin.
    # `connect-src` lists the API origin (REST + WebSocket/SSE) plus Google's
    # Live endpoint, which the browser opens directly because audio flows
    # device<->Google and never through Nessie.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: https://api.nessie.works wss://api.nessie.works https://api.nessie.unlikeotherai.com wss://api.nessie.unlikeotherai.com wss://generativelanguage.googleapis.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";

    # SPA fallback: every non-asset route resolves to index.html so client-side
    # routing (react-router) works on hard refresh / deep links.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(), fullscreen=(self), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # nginx's bundled MIME table does not include .mjs. PDF.js loads its
    # fingerprinted worker as an ES module; octet-stream plus nosniff makes
    # Safari refuse it, leaving every PDF preview in the error state.
    location ~ ^/assets/.*\.mjs$ {
        types { text/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(), fullscreen=(self), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # The pre-paint theme script is part of the entry document, not a
    # fingerprinted asset, so it is revalidated like index.html. Heuristic
    # caching of an unfingerprinted script would otherwise let a release ship a
    # new index.html beside last week's idea of the person's theme.
    location = /boot-theme.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Container healthcheck target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
