name: Nessie
options:
  bundleIdPrefix: com.nessie
  deploymentTarget:
    macOS: "14.0"
packages:
  AppReveal:
    url: https://github.com/UnlikeOtherAI/AppReveal.git
    exactVersion: "0.8.0"
targets:
  Nessie:
    type: application
    platform: macOS
    sources:
      - path: Nessie
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nessie.app
      INFOPLIST_FILE: Nessie/Info.plist
      CODE_SIGN_ENTITLEMENTS: Nessie/Nessie.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            cd "${SRCROOT}/.."
            swiftlint lint --strict --config .swiftlint.yml
          else
            echo "error: SwiftLint not installed. Run: brew install swiftlint"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - package: AppReveal
        product: AppReveal
