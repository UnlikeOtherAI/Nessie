<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nessie Admin</title>
    <script>
      try{var t=localStorage.getItem('nessie.theme');if(t&&['nebula','midnight','daylight','forest','ocean','sunset','rose','graphite','sandstone'].indexOf(t)>=0)document.documentElement.dataset.theme=t;}catch(e){}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
