<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Nessie Admin</title>
    <!-- The first paint's theme and reading size. A separate same-origin file,
         not an inline script: the admin is served with an enforcing
         `script-src 'self'` (infrastructure/docker/admin-nginx.conf), which
         refuses inline script in production while dev runs it happily — which
         is how every production reload came to paint the purple :root palette
         before repainting in the person's own theme. Classic and blocking, so
         it beats the first paint; a module script would be deferred. -->
    <script src="/boot-theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
