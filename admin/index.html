<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f3f5f8" />
    <title>Nessie Admin</title>
    <script>
      var t = null
      try {
        t = localStorage.getItem('nessie.theme')
      } catch (e) {}
      var systemTheme =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'nebula'
          : 'space-white'
      var themes = [
        'space-white',
        'nebula',
        'midnight',
        'daylight',
        'forest',
        'ocean',
        'sunset',
        'rose',
        'graphite',
        'sandstone',
        'contrast',
      ]
      document.documentElement.dataset.theme =
        t === 'system' ? systemTheme : (!t || themes.indexOf(t) < 0 ? 'space-white' : t)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
