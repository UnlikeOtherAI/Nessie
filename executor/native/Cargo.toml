[package]
name = "nessie-executor-native"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "nessie-executor-native"
path = "src/main.rs"

[dependencies]
libc = "0.2.182"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.24.0"

# Only the Win32 surfaces the helper's commands need: token and SID reads, the
# DACL get/set pair and the file access mask they grant for state security;
# the Job Object, the process snapshot and the wait for `job-run`.
[target."cfg(windows)".dependencies]
portable-pty = "0.9.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
