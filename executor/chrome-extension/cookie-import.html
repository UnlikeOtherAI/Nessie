<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nessie browser import</title>
    <style>
      body { color: #1f2937; font: 14px system-ui, sans-serif; margin: 16px; min-width: 300px; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      p { line-height: 1.4; margin: 8px 0; }
      fieldset { border: 1px solid #d1d5db; border-radius: 6px; margin: 12px 0; padding: 8px; }
      legend { padding: 0 4px; }
      label { display: block; margin: 7px 0; overflow-wrap: anywhere; }
      button { background: #1d4ed8; border: 0; border-radius: 5px; color: white; padding: 8px 11px; }
      button[disabled] { background: #9ca3af; }
      #status { color: #4b5563; }
    </style>
  </head>
  <body>
    <h1>Import selected site sign-ins</h1>
    <div id="content"><p id="status">Checking for an import you started in Nessie…</p></div>
    <script type="module" src="cookie-import.js"></script>
  </body>
</html>
