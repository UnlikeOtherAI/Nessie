<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nessie Executor</title>
    <!--
      The tray's status window. It is deliberately not the admin bundle and not
      a copy of any part of it: it renders one list of executor ids and states
      and offers the same actions the menu does, all through this application's
      own commands. Nothing here fetches, stores, or knows a credential, and the
      colours are the tray's own tokens rather than an import of the admin theme.
    -->
    <style>
      :root {
        --bg: #141221;
        --panel: #1d1a2e;
        --line: #2c2842;
        --tx: #efedf7;
        --tx2: #a9a4c4;
        --accent: #7a5af0;
        --running: #35c46a;
        --attention: #e8a33d;
        --error: #e0523f;
        --idle: #8a8f98;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        /* The window is frameless, so its title bar is the drag handle. */
        -webkit-app-region: drag;
      }
      header button { -webkit-app-region: no-drag; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); flex: none; }
      .dot[data-state="running"] { background: var(--running); }
      .dot[data-state="attention"] { background: var(--attention); }
      .dot[data-state="error"] { background: var(--error); }
      h1 { font-size: 13px; font-weight: 600; margin: 0; flex: 1; }
      main { flex: 1; overflow-y: auto; padding: 8px 12px; }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        margin-bottom: 6px;
      }
      .row .id { font-family: "Cascadia Mono", Consolas, monospace; }
      .row .state { color: var(--tx2); flex: 1; }
      .empty { color: var(--tx2); padding: 12px 4px; }
      .problem { color: var(--error); padding: 12px 4px; }
      footer { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 6px; }
      button {
        font: inherit;
        color: var(--tx);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); }
      form { display: none; gap: 6px; flex-direction: column; padding: 8px 12px; border-top: 1px solid var(--line); }
      form[data-open="true"] { display: flex; }
      textarea {
        font: 12px/1.4 "Cascadia Mono", Consolas, monospace;
        color: var(--tx);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px;
        resize: none;
        height: 56px;
      }
      .hint { color: var(--tx2); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1 id="headline">Checking the Nessie Executor service…</h1>
      <button id="hide" title="Close this window">Close</button>
    </header>
    <main id="list"></main>
    <form id="pair-form">
      <label class="hint" for="invitation">
        Paste the pairing command or link from Agents → Executors in Nessie.
      </label>
      <textarea id="invitation" spellcheck="false"></textarea>
      <div style="display: flex; gap: 6px">
        <button type="submit" class="primary">Choose workspace and pair</button>
        <button type="button" id="pair-cancel">Cancel</button>
      </div>
    </form>
    <footer>
      <button id="pair">Pair a new executor…</button>
      <button id="open-nessie">Open Nessie</button>
      <button id="open-logs">Logs</button>
    </footer>

    <script>
      const invoke = window.__TAURI__.core.invoke
      const list = document.getElementById('list')
      const dot = document.getElementById('dot')
      const headline = document.getElementById('headline')
      const form = document.getElementById('pair-form')
      let busy = false

      const trayState = (view) => {
        if (view.kind !== 'reachable') return 'error'
        if (view.executors.some((e) => e.daemonStatus === 'stopping' || e.daemonStatus === 'awaiting_confirmation')) {
          return 'attention'
        }
        return view.executors.some((e) => e.daemonStatus === 'running') ? 'running' : 'idle'
      }

      const headlineFor = (view) => {
        if (view.kind !== 'reachable') return `Nessie Executor — ${view.reason}`
        if (view.executors.length === 0) return 'Nessie Executor — nothing paired'
        const running = view.executors.filter((e) => e.daemonStatus === 'running').length
        return `Nessie Executor — ${running} of ${view.executors.length} running`
      }

      const render = (view) => {
        dot.dataset.state = trayState(view)
        headline.textContent = headlineFor(view)
        list.replaceChildren()
        if (view.kind !== 'reachable') {
          const problem = document.createElement('p')
          problem.className = 'problem'
          problem.textContent = view.reason
          list.append(problem)
          return
        }
        if (view.executors.length === 0) {
          const empty = document.createElement('p')
          empty.className = 'empty'
          empty.textContent = 'No executor is paired on this computer yet.'
          list.append(empty)
          return
        }
        for (const executor of view.executors) {
          const row = document.createElement('div')
          row.className = 'row'
          const id = document.createElement('span')
          id.className = 'id'
          id.textContent = executor.executorId.split('-')[0]
          const state = document.createElement('span')
          state.className = 'state'
          state.textContent = executor.daemonStatus
          const start = document.createElement('button')
          start.textContent = 'Start'
          start.disabled = busy || executor.daemonStatus === 'running'
          start.onclick = () => act('executor_start', { executorId: executor.executorId })
          const stop = document.createElement('button')
          stop.textContent = 'Stop'
          stop.disabled = busy || executor.daemonStatus !== 'running'
          stop.onclick = () => act('executor_stop', { executorId: executor.executorId })
          row.append(id, state, start, stop)
          list.append(row)
        }
      }

      const refresh = async () => {
        render(await invoke('executor_view'))
      }

      // Every action confirms in a native dialog inside the command, so the
      // only thing left here is to keep the buttons from being pressed twice
      // and to show whatever the service refused with.
      const act = async (command, args) => {
        if (busy) return
        busy = true
        try {
          render(await invoke(command, args))
        } catch (reason) {
          headline.textContent = String(reason)
          dot.dataset.state = 'attention'
        } finally {
          busy = false
          await refresh()
        }
      }

      const openPairForm = () => {
        form.dataset.open = 'true'
        document.getElementById('invitation').focus()
      }

      document.getElementById('pair').onclick = openPairForm
      document.getElementById('pair-cancel').onclick = () => {
        form.dataset.open = 'false'
      }
      form.onsubmit = async (event) => {
        event.preventDefault()
        const invitation = document.getElementById('invitation').value
        await act('executor_pair', { invitation })
        document.getElementById('invitation').value = ''
        form.dataset.open = 'false'
      }
      document.getElementById('open-nessie').onclick = () => invoke('executor_open_nessie')
      document.getElementById('open-logs').onclick = () =>
        invoke('executor_open_logs').catch((reason) => {
          headline.textContent = String(reason)
        })
      document.getElementById('hide').onclick = () => invoke('executor_hide_status')

      window.__TAURI__.event.listen('tray://pair', openPairForm)
      refresh()
      setInterval(refresh, 3000)
    </script>
  </body>
</html>
