name: Install dependencies
description: Install dependencies with the scoped Deep.Agent read token.
inputs:
  deep-agent-read-token:
    description: Fine-grained Contents:read token for UnlikeOtherAI/deep.agent.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEEP_AGENT_READ_TOKEN: ${{ inputs.deep-agent-read-token }}
        # The pnpm version Deep.Agent's packages pin in their own
        # `packageManager` field. Keep it in step with that repository.
        DEEP_AGENT_PNPM_VERSION: "9.12.0"
      run: |
        bash scripts/with-deep-agent-token.test.sh

        # Deep.Agent is a git-hosted dependency, so pnpm prepares each of its
        # packages by running `pnpm install` inside it. Those packages pin an
        # older pnpm, and this repository's pnpm switches to it on demand by
        # downloading it into one shared tools directory. Several packages are
        # prepared concurrently, so on Windows the parallel downloads collide
        # (ENOTEMPTY, then a missing pnpm.cjs/worker.js) and the install fails.
        # Fetch that version once, alone, before the install: every concurrent
        # prepare then finds it complete. A stale pin cannot break the install;
        # it only lets the race back in.
        warm_dir="$(mktemp -d)"
        printf '{"name":"pnpm-version-warmup","private":true,"packageManager":"pnpm@%s"}\n' \
          "$DEEP_AGENT_PNPM_VERSION" > "$warm_dir/package.json"
        (cd "$warm_dir" && pnpm --version)
        rm -rf "$warm_dir"

        scripts/with-deep-agent-token.sh pnpm install --frozen-lockfile
