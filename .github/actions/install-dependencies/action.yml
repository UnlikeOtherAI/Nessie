name: Install dependencies
description: Install dependencies with the read-only Deep.Agent deploy key.
inputs:
  deep-agent-read-token:
    description: Fine-grained Contents:read token for UnlikeOtherAI/deep.agent.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEEP_AGENT_READ_TOKEN: ${{ inputs.deep-agent-read-token }}
      run: |
        scripts/with-deep-agent-ssh.sh pnpm install --frozen-lockfile
