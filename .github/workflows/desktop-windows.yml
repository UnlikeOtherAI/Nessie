name: Desktop (Windows)

# Builds the Windows desktop artifacts and the standalone executor package, signs
# them where a signing identity is configured, and proves they install: a build
# that is never installed is not a delivery, and an unsigned one is never called
# a release.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or SHA to build (the selected workflow ref is used when empty)."
        required: false
        type: string
  push:
    tags: ["desktop-v*"]

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # The WiX major this repository's authoring targets. Both its schema and its
  # CLI change between majors, so it is pinned rather than "whatever installs".
  # WiX 7 additionally requires accepting its OSMF EULA; changing that legal
  # commitment is an owner decision, not something a CI job may do implicitly.
  WIX_VERSION: "5.0.2"

jobs:
  # The guest kernel is a Linux build: a bzImage with the EFI stub, the Hyper-V
  # drivers, and the built-in command line Hyper-V's firmware cannot supply.
  # It is built here and handed to the Windows job as an artifact, because the
  # Windows runner has no Linux toolchain and the kernel is what the sandbox
  # boots.
  guest-kernel:
    name: Guest kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential flex libelf-dev libssl-dev

      - name: Cache the pinned kernel source
        uses: actions/cache@v4
        with:
          path: ~/.cache/nessie-guest-kernel
          key: guest-kernel-${{ hashFiles('executor/guest/kernel/PIN') }}

      - name: Build the guest kernel
        run: |
          set -euo pipefail
          # PIN carries the tarball URL and the SHA-256 kernel.org publishes for
          # it; build.sh verifies the digest before a byte is extracted and
          # fails if any option the fragment asked for is not in the resolved
          # configuration.
          . executor/guest/kernel/PIN
          mkdir -p ~/.cache/nessie-guest-kernel
          tarball=~/.cache/nessie-guest-kernel/"linux-${KERNEL_VERSION}.tar.xz"
          [ -f "${tarball}" ] || curl --fail --silent --show-error --location \
            --output "${tarball}" "${KERNEL_URL}"
          KERNEL_BUILD_JOBS=$(nproc) executor/guest/kernel/build.sh "${RUNNER_TEMP}/kernel" "${tarball}"

      - name: Upload the guest kernel
        uses: actions/upload-artifact@v4
        with:
          name: guest-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/kernel/
          if-no-files-found: error

  build:
    name: Build, sign, and install smoke
    runs-on: windows-latest
    needs: guest-kernel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          # lint:migrations compares the delivery ref against main, so a manual
          # source-ref build needs the full repository history rather than the
          # checkout action's default one-commit fetch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The packaged executor runtime is a copy of the build host's Node, so
          # the host must run the version the bundle targets.
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
            executor/native/target
            executor/service-windows/target
            executor/tray-windows/src-tauri/target
            executor/hyperv-bridge/target
          key: >-
            desktop-windows-cargo-${{ hashFiles(
              'desktop/src-tauri/Cargo.lock',
              'executor/native/Cargo.lock',
              'executor/service-windows/Cargo.lock',
              'executor/hyperv-bridge/Cargo.lock',
              'executor/tray-windows/src-tauri/Cargo.lock') }}
          restore-keys: desktop-windows-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bundle is a release artifact, so do not bypass the repository's
      # lint gate when invoking Tauri directly below.
      - name: Lint repository
        run: pnpm lint

      # The generated Prisma client is intentionally excluded from source
      # control. Generate it once before Turbo builds `@nessie/db`, rather than
      # letting concurrent package builds race to create it.
      - name: Generate Prisma client
        run: pnpm prisma:generate

      # `prepare:executor-runtime` bundles the TypeScript executor with esbuild.
      # It resolves team packages through their published `dist` exports,
      # so installing the team links alone is insufficient on a clean
      # runner. Build the executor and every one of those dependencies in the
      # serialized Turbo order before Tauri invokes that preparation step.
      - name: Build executor bundle dependencies
        run: pnpm exec turbo run build --filter=@nessie/executor...

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: executor/guest/go.sum

      # The bzImage the Linux job built. The package refuses to build without
      # it rather than shipping a sandbox that cannot boot.
      - name: Download the guest kernel
        uses: actions/download-artifact@v4
        with:
          name: guest-kernel-${{ github.sha }}
          path: guest-kernel

      - name: Resolve release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
            "NESSIE_EXECUTOR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # Every Rust crate this platform ships, including the two that are new
      # here. The shared provenance crate is tested on its own because both
      # binaries depend on its decision being right.
      - name: Rust tests
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          cargo test --manifest-path executor/native/Cargo.toml
          cargo test --manifest-path executor/windows-provenance/Cargo.toml
          cargo test --manifest-path executor/service-windows/Cargo.toml
          cargo test --manifest-path executor/hyperv-bridge/Cargo.toml
          cargo test --manifest-path executor/tray-windows/src-tauri/Cargo.toml

      - name: Installer authoring tests
        run: node --test executor/packaging/windows/msi-plan.test.mjs

      - name: Install the WiX toolset
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Enable VBScript for MSI validation
        shell: pwsh
        run: |
          # Windows Installer's ICE validators are VBScript, which recent Windows
          # builds ship as an optional capability. Where it is optional, add it;
          # where it is not, it is already present. Either way the build must not
          # proceed without it, or `wix build` fails in the middle with a message
          # about a script engine.
          $capability = Get-WindowsCapability -Online -Name 'VBSCRIPT~~~~' -ErrorAction SilentlyContinue
          if ($capability -and $capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name | Out-Null
          }
          if (-not (Test-Path "$env:SystemRoot\System32\vbscript.dll")) {
            throw 'VBScript is unavailable, so WiX cannot validate the MSI on this runner.'
          }

      # Signing is a deployment fact. A tag release and a manual verification
      # of the exact main branch both require the configured identity. A source
      # override remains an unsigned development build, so repository code from
      # another ref can never receive signing credentials.
      - name: Resolve signing configuration
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGN_TOOL_INSTALL: ${{ secrets.WINDOWS_SIGN_TOOL_INSTALL }}
          WINDOWS_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_SIGNER_THUMBPRINT }}
          WINDOWS_SIGNER_SUBJECT: ${{ secrets.WINDOWS_SIGNER_SUBJECT }}
        run: |
          # The `secrets` context is not usable in a step's `if`, so every later
          # step branches on these outputs rather than on the secrets directly.
          $release = $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'desktop-v*'
          $trustedMainVerification = `
            $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and `
            $env:GITHUB_REF -eq 'refs/heads/main' -and `
            -not '${{ inputs.source_ref }}'
          if ($release -and '${{ inputs.source_ref }}') {
            throw 'A signed desktop release must build the tagged source; source_ref is for unsigned development builds only.'
          }
          $configured = [bool]($env:WINDOWS_SIGN_COMMAND -and $env:WINDOWS_SIGNER_THUMBPRINT -and $env:WINDOWS_SIGNER_SUBJECT)
          $signingRequired = $release -or $trustedMainVerification
          if ($signingRequired -and -not $configured) {
            throw 'A desktop-v* release or trusted main verification requires the Windows signing command, signer thumbprint, and signer subject.'
          }
          $signed = [bool]($signingRequired -and $configured)
          "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $installs = [bool]($signed -and $env:WINDOWS_SIGN_TOOL_INSTALL)
          "install_tool=$($installs.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($signed) {
            Write-Host 'Signing the trusted source with the configured Windows publisher.'
            # The publisher compiled into the release is what the desktop
            # companion and the executor service pin at runtime; without it a
            # release build refuses executor controls by design.
            "NESSIE_DESKTOP_WINDOWS_SIGNER_THUMBPRINT=$env:WINDOWS_SIGNER_THUMBPRINT" |
              Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host '::warning::Source-ref and non-main manual builds are unsigned development builds, not releases.'
          }

      # Azure Artifact Signing is the recommended configuration: no private key
      # is ever present on a runner and SmartScreen reputation attaches to the
      # managed identity. Its CLI is installed by the command the secret names,
      # so the tool can change without editing this workflow.
      - name: Install the signing tool
        if: steps.signing.outputs.install_tool == 'true'
        run: ${{ secrets.WINDOWS_SIGN_TOOL_INSTALL }}

      - name: Build the desktop bundles
        shell: pwsh
        env:
          # Read by the signing CLI when the configuration is Azure Artifact
          # Signing; unused by a certificate-thumbprint configuration.
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          WINDOWS_SIGN_COMMAND: ${{ steps.signing.outputs.signed == 'true' && secrets.WINDOWS_SIGN_COMMAND || '' }}
        run: |
          # `signCommand` carries `%1`, which Tauri replaces with each artifact's
          # path. The placeholder values in tauri.windows.conf.json are null, so
          # an unsigned build simply does not sign.
          $arguments = @('--bundles', 'nsis,msi')
          if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
            $env:NESSIE_WINDOWS_SIGN_COMMAND = $env:WINDOWS_SIGN_COMMAND
            $config = @{ bundle = @{ windows = @{ signCommand = $env:WINDOWS_SIGN_COMMAND } } } |
              ConvertTo-Json -Depth 5 -Compress
            $arguments += @('--config', $config)
          }
          # Call Tauri directly after runtime preparation. Passing a second
          # argument separator through the package script reaches Cargo as a
          # literal `--`, so Cargo mistakes the bundle flags for its own.
          pnpm --dir desktop run prepare:executor-runtime
          # The desktop is installed per-user. An adjacent hash manifest is
          # therefore not an authority by itself: compile its exact runtime
          # hashes into the application before Tauri signs that executable.
          $runtimeManifest = Get-Content `
            'desktop/src-tauri/resources/executor-runtime/manifest.json' -Raw |
            ConvertFrom-Json
          $runtimePins = @{
            NESSIE_DESKTOP_EXECUTOR_BUNDLE_SHA256 = $runtimeManifest.executorBundleSha256
            NESSIE_DESKTOP_EXECUTOR_NATIVE_HELPER_SHA256 = $runtimeManifest.nativeHelperSha256
            NESSIE_DESKTOP_EXECUTOR_NODE_SHA256 = $runtimeManifest.nodeSha256
          }
          foreach ($pin in $runtimePins.GetEnumerator()) {
            if ($pin.Value -notmatch '^[0-9a-f]{64}$') {
              throw "The prepared Windows executor runtime did not provide a valid $($pin.Key)."
            }
            Set-Item -Path "Env:$($pin.Key)" -Value $pin.Value
          }
          pnpm --dir desktop exec tauri build @arguments

      # This is the executable control path rather than a collection of unit
      # seams: it pairs a machine key with a loopback control plane, claims and
      # heartbeats with signed frames, polls four real commands, records signed
      # receipts, proves the selected folder can be read, proves a traversal is
      # denied, and proves writes remain in the daemon's COW state. Running it
      # here also exercises the Windows DACL helper the desktop just packaged.
      - name: Executor control-plane and folder-boundary end to end
        shell: pwsh
        run: |
          $env:NESSIE_EXECUTOR_PACKAGED_CLI = '1'
          & 'desktop/src-tauri/resources/executor-runtime/node.exe' `
            --test --import tsx executor/test/control-plane-e2e.test.ts

      # Tauri signs what it bundles; the executor package is not a Tauri artifact.
      # The build script signs the three binaries it produces *before* staging
      # them, because the native helper's bytes are pinned in the runtime
      # manifest and a signature added afterwards would no longer match it.
      - name: Build the standalone executor package
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          WINDOWS_SIGN_COMMAND: ${{ steps.signing.outputs.signed == 'true' && secrets.WINDOWS_SIGN_COMMAND || '' }}
        run: |
          if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
            $env:NESSIE_WINDOWS_SIGN_COMMAND = $env:WINDOWS_SIGN_COMMAND
          }
          $env:NESSIE_GUEST_KERNEL = "$PWD\guest-kernel\bzImage"
          node executor/packaging/windows/build-msi.mjs

      - name: Sign the executor package
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          Get-ChildItem dist -Filter 'NessieExecutor_*_x64.msi' | ForEach-Object {
            $command = $env:WINDOWS_SIGN_COMMAND -replace '%1', "`"$($_.FullName)`""
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) { throw "signing $($_.Name) failed" }
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe artifacts/
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi artifacts/
          Copy-Item dist/NessieExecutor_*.msi artifacts/
          # The three binaries the MSI carries, as built and signed. They travel
          # beside the installers so the signature gate below covers every
          # executable a person can right-click, not only the installers.
          New-Item -ItemType Directory -Path artifacts/binaries -Force | Out-Null
          Copy-Item executor/service-windows/target/release/nessie-executor-service.exe artifacts/binaries/
          Copy-Item executor/tray-windows/src-tauri/target/release/nessie-executor-tray.exe artifacts/binaries/
          Copy-Item executor/native/target/release/nessie-executor-native.exe artifacts/binaries/
          New-Item -ItemType Directory -Path artifacts/runtime -Force | Out-Null
          Copy-Item desktop/src-tauri/resources/executor-runtime/nessie-executor-native.exe `
            artifacts/runtime/nessie-desktop-executor-native.exe
          Copy-Item desktop/src-tauri/resources/executor-runtime/node.exe artifacts/runtime/node.exe
          $executorPackage = Get-ChildItem artifacts -Filter 'NessieExecutor_*_x64.msi' |
            Select-Object -First 1
          $executorPayload = Join-Path $PWD 'executor-payload'
          Start-Process msiexec -ArgumentList "/a `"$($executorPackage.FullName)`" /qn TARGETDIR=`"$executorPayload`"" -Wait
          New-Item -ItemType Directory -Path artifacts/executor-payload -Force | Out-Null
          Get-ChildItem $executorPayload -Include *.exe -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName (Join-Path artifacts/executor-payload $_.Name)
          }
          Get-ChildItem artifacts -Recurse -File | Format-Table Name, Length

      # The release gate. Every artifact must carry a valid signature from the
      # expected publisher, or the job fails; an unsigned build skips the gate
      # and is labelled a development build instead of quietly passing it.
      - name: Verify signatures
        shell: pwsh
        env:
          WINDOWS_SIGNER_SUBJECT: ${{ secrets.WINDOWS_SIGNER_SUBJECT }}
          WINDOWS_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          if ('${{ steps.signing.outputs.signed }}' -ne 'true') {
            Write-Host '::warning::Unsigned development build — signature verification skipped and no release may be cut from it.'
            exit 0
          }
          $failed = @()
          $expectedThumbprint = $env:WINDOWS_SIGNER_THUMBPRINT -replace '[^0-9A-Fa-f]', ''
          if ($expectedThumbprint.Length -ne 40) {
            throw 'WINDOWS_SIGNER_THUMBPRINT must contain exactly 40 hexadecimal characters.'
          }
          Get-ChildItem artifacts -Include *.exe, *.msi -Recurse -File |
            Where-Object { $_.Name -ne 'node.exe' } |
            ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            $subject = $signature.SignerCertificate.Subject
            $thumbprint = $signature.SignerCertificate.Thumbprint -replace '[^0-9A-Fa-f]', ''
            Write-Host "$($_.Name): $($signature.Status) $subject $thumbprint"
            if (
              $signature.Status -ne 'Valid' -or
              $subject -notlike "*$env:WINDOWS_SIGNER_SUBJECT*" -or
              $thumbprint -ine $expectedThumbprint
            ) {
              $failed += $_.Name
            }
          }
          if ($failed.Count -gt 0) { throw "unsigned or wrongly signed: $($failed -join ', ')" }
          Get-ChildItem artifacts -Filter node.exe -Recurse -File | ForEach-Object {
            $node = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.FullName): $($node.Status) $($node.SignerCertificate.Subject)"
            if ($node.Status -ne 'Valid') {
              throw "the packaged Node runtime $($_.FullName) does not carry a valid upstream Authenticode signature"
            }
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Include *.exe, *.msi -Recurse -File |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -FilePath artifacts/SHA256SUMS -Encoding ascii
          Get-Content artifacts/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Desktop install, launch, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          # The sign-in callback returns through nessie://, so the scheme has to
          # be registered for the installing user.
          if (-not (Test-Path 'HKCU:\Software\Classes\nessie')) {
            throw 'the nessie:// scheme was not registered'
          }
          $install = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq 'Nessie' } |
            Select-Object -First 1
          if (-not $install) { throw 'the Nessie uninstall registration was not found' }
          $installRoot = $install.InstallLocation.Trim('"')
          $appPath = Join-Path $installRoot 'nessie-desktop.exe'
          if (-not (Test-Path -LiteralPath $appPath)) {
            throw "the installed nessie-desktop.exe was not found at $appPath"
          }
          $app = Get-Item -LiteralPath $appPath

          # No console: the PE subsystem must be GUI (2). A console subsystem
          # binary flashes a terminal at every launch, which is the defect this
          # asserts against rather than hoping nobody notices.
          $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          if ($subsystem -ne 2) { throw "nessie-desktop.exe is not a GUI subsystem binary (got $subsystem)" }

          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 10
          $running = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
          if (-not $running) { throw 'Nessie exited within ten seconds' }
          $running.Refresh()
          if ($running.MainWindowTitle -ne 'Nessie') {
            throw "expected a window titled Nessie, found '$($running.MainWindowTitle)'"
          }
          Stop-Process -Id $process.Id -Force

          $uninstall = $install.UninstallString.Trim('"')
          Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path -LiteralPath $app.FullName) { throw 'the desktop app was not uninstalled' }

      - name: Executor package install, service, and uninstall
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts -Filter 'NessieExecutor_*_x64.msi' | Select-Object -First 1
          Start-Process msiexec -ArgumentList "/i `"$($package.FullName)`" /qn /l*v $PWD\msi-install.log" -Wait
          $service = Get-CimInstance Win32_Service -Filter "Name='NessieExecutor'"
          if (-not $service) { Get-Content msi-install.log -Tail 60; throw 'the service was not registered' }
          # The virtual account: no password, no interactive logon, its own SID.
          if ($service.StartName -ne 'NT SERVICE\NessieExecutor') {
            throw "the service runs as $($service.StartName)"
          }
          if ($service.StartMode -ne 'Auto') { throw 'the service does not start at boot' }

          # A signed release supervises; an unsigned development build keeps the
          # service running and refuses in words, which is the behaviour the
          # tamper case in the acceptance checklist depends on.
          if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
            if ($service.State -ne 'Running') { throw 'the service is not running' }
          } else {
            Write-Host "unsigned build: service state is $($service.State)"
          }

          $stateRoot = Join-Path $env:ProgramData 'Nessie Executor'
          if (-not (Test-Path $stateRoot)) { throw 'the state root was not created' }
          (Get-Acl $stateRoot).Access | Format-Table IdentityReference, FileSystemRights, IsInherited

          # The Run entry starts the tray at the installing user's next logon;
          # there is no logon here, so the tray is started directly and must
          # survive with no window of its own.
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name NessieExecutorTray
          if (-not $run.NessieExecutorTray) { throw 'the tray autostart entry is missing' }
          $tray = Start-Process -FilePath "$env:ProgramFiles\Nessie Executor\nessie-executor-tray.exe" -PassThru
          Start-Sleep -Seconds 10
          $trayRunning = Get-Process -Id $tray.Id -ErrorAction SilentlyContinue
          if (-not $trayRunning) { throw 'the tray exited within ten seconds' }
          $trayRunning.Refresh()
          if ($trayRunning.MainWindowTitle -ne '') {
            throw "the tray opened a window at launch: '$($trayRunning.MainWindowTitle)'"
          }
          Stop-Process -Id $tray.Id -Force

          Start-Process msiexec -ArgumentList "/x `"$($package.FullName)`" /qn" -Wait
          if (Get-Service NessieExecutor -ErrorAction SilentlyContinue) {
            throw 'the service was not removed'
          }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name NessieExecutorTray -ErrorAction SilentlyContinue) {
            throw 'the tray autostart entry was not removed'
          }
          # Deliberate: a pairing is a machine key and a signed policy revision,
          # and uninstalling a program is not a request to destroy them.
          if (-not (Test-Path $stateRoot)) { throw 'the state root was removed by uninstall' }

  hyperv-conformance:
    name: Hyper-V backend conformance
    # This job runs with Hyper-V administrator rights on a persistent machine.
    # A manually supplied source ref may compile on GitHub-hosted Windows, but
    # it must never execute on this privileged runner. Only the exact trusted
    # main ref or a desktop release tag can reach it, and only after the signed
    # build/install job succeeds.
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_ref == '')
    # GitHub-hosted Windows runners offer no nested virtualization, so this job
    # CANNOT run there. The `hyperv` label is the deployment's obligation — a
    # self-hosted Windows 11 Pro (or Server) runner with the Hyper-V role
    # enabled and the runner's account in Hyper-V Administrators. Until such a
    # runner is registered this job stays queued, which is the honest state; it
    # must never be made to pass by skipping, because the command and coding
    # profiles are advertised to agents on the strength of exactly this
    # evidence. It mirrors `firecracker-conformance` in desktop-linux.yml.
    runs-on: [self-hosted, windows, hyperv]
    needs: [guest-kernel, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Hyper-V is present and usable by this runner
        shell: pwsh
        run: |
          # A missing Hyper-V FAILS the job. `detectExecutorHost` decides the
          # Windows sandbox backend by the presence of this exact binary, so
          # anything less would advertise a sandbox the daemon would refuse.
          if (-not (Test-Path "$env:SystemRoot\System32\vmms.exe")) {
            throw 'Hyper-V is not installed on this runner.'
          }
          if ((Get-Service vmms).Status -ne 'Running') {
            throw 'the Hyper-V Virtual Machine Management service is not running'
          }
          Get-Module -ListAvailable Hyper-V | Format-Table Name, Version
          Get-VMHost | Format-List Name, VirtualMachinePath, VirtualHardDiskPath

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: executor/guest/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@nessie/executor...

      - name: The host reports the Hyper-V backend
        shell: pwsh
        run: |
          node --import tsx -e "
            import('./executor/src/host-platform.ts').then((module) => {
              const host = module.detectExecutorHost()
              console.log(JSON.stringify(host))
              if (host.sandboxBackend !== 'hyperv') {
                throw new Error('This runner has Hyper-V but reports ' + host.sandboxBackend + '.')
              }
            })
          "

      - name: The bridge builds and its protocol half passes its own tests
        run: |
          cargo test --manifest-path executor/hyperv-bridge/Cargo.toml
          cargo build --release --manifest-path executor/hyperv-bridge/Cargo.toml

      - name: The guest builds and passes its own tests
        working-directory: executor/guest
        shell: bash
        run: |
          set -euo pipefail
          # `-o /dev/null`: a bare `go build ./...` writes the binary beside the
          # sources under the module name and would overwrite the checked-in
          # aarch64 guest artifact.
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/build-initrd
          go vet ./...
          go test ./...

      - name: Hyper-V backend conformance
        working-directory: executor
        # The suites that gate the command and coding profiles on this host: the
        # pinned-script argv and lifecycle sequence, the fixed-VHD footer the
        # disks are wrapped in, the FAT boot disk's command list, the named-pipe
        # transport carrying the shared control and forced-egress channels, and
        # the backend seam that chooses this backend at all. A booted-guest run
        # is added here once such a runner exists; see
        # docs/executor-protocol/sandbox-forced-egress-and-credentials.md.
        run: node --test --import tsx "test/hyperv-*.test.ts" "test/firecracker-protocol.test.ts"

      - name: Download the guest kernel
        uses: actions/download-artifact@v4
        with:
          name: guest-kernel-${{ github.sha }}
          path: guest-kernel

      - name: The guest kernel is the one the backend expects
        shell: pwsh
        run: |
          # The built-in command line is the only one this guest ever gets, so a
          # kernel built without it would boot with no arguments at all.
          $bytes = [System.IO.File]::ReadAllBytes("guest-kernel/bzImage")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'nessie\.args=initrd') {
            throw 'the guest kernel carries no built-in Nessie command line'
          }
          Get-Content guest-kernel/bzImage.sha256
