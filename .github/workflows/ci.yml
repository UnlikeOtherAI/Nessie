name: CI

on:
  push:
    branches: ["**"]

# On branches a new push supersedes the previous CI run, so cancel it. On main
# every push must get its OWN completed run: with a shared main group, heavy
# merge traffic cancelled main builds mid-flight (in-progress) or collapsed
# them out of the queue, so main could go hours without a single finished test
# run. Keying the main group by sha makes each merge's CI run independent —
# nothing is ever cancelled on main.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs deliberately declare no `needs`. Lint and Type Check used to gate the
# other six, which idled every runner for the 5m40s those two took and made a
# lint failure hide whether the tests passed at all. Both are still REQUIRED
# status checks on main, so nothing merges without them — only the ordering is
# gone, not the gate. Root `pnpm build` also keeps its own internal lint gate.
# The one `needs` is `Test`, the required check standing for its legs.
#
# The Linux Desktop Bundle and Windows Native checks live in Desktop CI
# (desktop-ci.yml): they are required on every pull request as before, but a
# desktop build no longer holds a server deploy, which waits for this workflow.
env:
  # Pin Turbo's filesystem cache so actions/cache restores exactly what Turbo
  # writes. Left alone, Turbo caches under the *git root*, which is not the
  # workspace root in every checkout layout.
  TURBO_CACHE_DIR: .turbo/cache
  # The ref `--affected` compares against. Every job checks out full history so
  # this merge-base resolves; on a shallow checkout Turbo silently treats every
  # package as changed.
  TURBO_SCM_BASE: origin/main
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the migration lint compares committed migration
          # folders against the merge-base with the base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-lint-

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      # Deliberately NOT narrowed by scope. Lint is the cheapest job and the
      # one every other gate leans on, and the root lint scripts
      # (markdown structure, breakpoints, navigation surfaces, layers,
      # migrations) scan the whole repo rather than a package subset.
      - name: Lint all packages
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-typecheck-

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      # Through Turbo rather than pnpm so the result is cached like every other
      # build. These three are the only packages whose dist the typecheck graph
      # can need ahead of time.
      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@nessie/schemas --filter=@nessie/config --filter=@nessie/runtime

      # `typecheck` keeps its `dependsOn: ["^typecheck"]` edge in turbo.json.
      # Dropping it would let 32 tsc runs go parallel, but it also removes the
      # dependency from each task's cache hash: measured on this repo, editing
      # packages/schemas left @nessie/memory's typecheck hash byte-identical, so
      # a cached pass would replay green over a breaking change. The speed comes
      # from the cache instead — unchanged packages replay in milliseconds.
      # Every tsc that loads the generated Prisma client holds ~2.2 GB. When a
      # change invalidates most of the cache, Turbo's default of 10 concurrent
      # tasks starts a wave of those at once and the runner's OOM killer ends
      # the step; 4 matches the test job (docs/standards/testing.md).
      - name: Typecheck packages
        run: pnpm typecheck
        env:
          TURBO_SCOPE: ${{ steps.scope.outputs.turbo_scope }}
          TURBO_CONCURRENCY: 4

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, same as the lint job: `pnpm build` is lint-gated and
          # runs `pnpm lint:migrations`, which needs a merge-base against the
          # base branch. A shallow branch checkout has no `origin/main` to
          # resolve, so every feature-branch build died before compiling.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      # Still the lint-gated root build, per AGENTS.md — the gate is inside
      # `pnpm build` and must not be swapped for a raw turbo invocation.
      # Same memory ceiling as the Type Check step: an uncached wave of
      # Prisma-loading tsc processes is OOM-killed at Turbo's default of 10.
      - name: Build all packages
        run: pnpm build
        env:
          TURBO_SCOPE: ${{ steps.scope.outputs.turbo_scope }}
          TURBO_CONCURRENCY: 4

  # The production images, built exactly as Deploy builds them — same
  # Dockerfiles, same build args, same private-package secret. Main saves the
  # built images for Deploy; branches never publish production artifacts.
  #
  # This job exists because every other check compiles the workspace on the
  # runner, where the whole repo is on disk, while the images build from a
  # *partial* context that each Dockerfile assembles by hand. Anything the
  # context omits is invisible until Deploy, which runs after merge: an import
  # of `scripts/dev-ports.mjs` added to admin/vite.config.ts passed all nine
  # checks, merged, and then took production promotion down with
  # `failed to load config from /app/admin/vite.config.ts`. The gap was
  # structural, not a fluke — the merge gate could not see the thing that ships.
  #
  # Cost is close to free in wall clock: app is the long leg at ~9m30s against a
  # CI run that already takes 15-21 minutes, and the three legs are parallel.
  # Only main refreshes the image cache; branch builds cannot evict it.
  #
  # Branch runs save their images too, for a day. When a merge lands exactly the
  # tree a branch run passed, Deploy promotes that run's images instead of
  # waiting for main to rebuild and retest the same tree
  # (docs/deployment/redeploying.md). Nothing from a branch is pushed to a
  # registry; only the deploy gate can promote an artifact, and only for a main
  # commit with the identical tree.
  images:
    name: Production Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infrastructure/docker/Dockerfile.app
            build-args: ""
          - name: admin
            dockerfile: infrastructure/docker/Dockerfile.admin
            # Must match Deploy's arg: the value is baked into the bundle.
            build-args: VITE_API_BASE_URL=https://api.nessie.works
          - name: web
            dockerfile: infrastructure/docker/Dockerfile.web
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolved before Buildx so a docs-only run sets nothing up. Only the
      # runner's preinstalled Node is needed; ci-scope.mjs shells out to git.
      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Set up Buildx
        if: steps.scope.outputs.images == '1'
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        if: steps.scope.outputs.images == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: nessie-ci-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          build-args: ${{ matrix.build-args }}
          secrets: |
            "deep_agent_read_token=${{ secrets.DEEP_AGENT_READ_TOKEN }}"
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

      - name: Save production image for gated promotion
        if: steps.scope.outputs.images == '1'
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ matrix.name }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          overwrite: true
          compression-level: 1
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}

      # The job still reports success, which is what a required check needs.
      - name: Report skip
        if: steps.scope.outputs.images != '1'
        run: echo "No production image input changed — ${{ matrix.name }} image not rebuilt."

  # The package suites, split across runners by what dominated the one job
  # they used to share (25-31 minutes): the API suite (18 minutes on its own),
  # the worker's unit and database suites (9 and 12), and every other package.
  # Each leg has its own database, builds only its own closure, and splits a
  # long suite with Node's --test-shard (scripts/ci-tests.mjs). `Test` below
  # is the required check that stands for all of them.
  test-legs:
    name: Test ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: api 1/3, group: api, shard: 1/3, cache: api }
          - { leg: api 2/3, group: api, shard: 2/3, cache: api }
          - { leg: api 3/3, group: api, shard: 3/3, cache: api }
          - { leg: worker unit, group: worker-unit, shard: '', cache: worker }
          - { leg: worker db 1/2, group: worker-db, shard: 1/2, cache: worker }
          - { leg: worker db 2/2, group: worker-db, shard: 2/2, cache: worker }
          - { leg: other packages, group: other, shard: '', cache: other }
    services:
      postgres:
        # pgvector image (Postgres 16 + the `vector` extension) — the schema's
        # enable_pgvector migration needs it; the stock postgres:16 image fails.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test
      # Hosted-mode imports must exercise the same dedicated-ring startup
      # contract as production. This deterministic test root is not a secret.
      NESSIE_ENCRYPTION_ACTIVE_KEY_VERSION: ci-test
      NESSIE_ENCRYPTION_KEY_RING: '{"ci-test":"ci-test-dedicated-encryption-root-material"}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      # One cache per leg group: the legs of a group build the same closure.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-test-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ matrix.cache }}-
            ${{ runner.os }}-turbo-test-

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Test deployment gate policy
        if: matrix.group == 'other'
        run: node --test scripts/deploy-gate.test.mjs scripts/ci-tests.test.mjs scripts/promote-ci-image.test.mjs

      # The macOS installer's plan: the refusals that keep an unsigned image from
      # being called installable, and its agreement with the release workflow.
      # It needs neither macOS nor a database, so it runs here rather than in the
      # Windows-native job that carries the MSI authoring tests.
      - name: Test the macOS installer authoring
        if: matrix.group == 'other'
        run: node --test executor/packaging/macos/dmg-plan.test.mjs

      # Serialized before the build on purpose: concurrent Prisma generators can
      # temporarily erase exports while sibling packages compile.
      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      - name: Run this leg
        # Interactive executor tests launch real, isolated tmux sessions.
        # The runner image is not our dependency declaration.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          node scripts/ci-tests.mjs
        env:
          TURBO_SCOPE: ${{ steps.scope.outputs.turbo_scope }}
          TURBO_CONCURRENCY: 4
          CI_TEST_GROUP: ${{ matrix.group }}
          CI_TEST_SHARD: ${{ matrix.shard }}

  # The required check. It runs even when a leg failed or was cancelled, so it
  # is red unless every leg passed — a skipped required check would read green.
  test:
    name: Test
    needs: test-legs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test leg
        env:
          LEGS: ${{ needs.test-legs.result }}
        run: |
          echo "Test legs: $LEGS"
          test "$LEGS" = success

  upgrade-path:
    name: Upgrade Path
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pgvector image as the test job: the fixture replay includes the
        # enable_pgvector migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_upgrade_ci
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_upgrade_ci
      UPGRADE_WORKFLOW_INSTALLATION_ORPHAN_ID: 11111111-1111-4111-8111-111111111115

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Install dependencies
        if: steps.scope.outputs.code == '1'
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Generate Prisma client
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # Restore the checked-in snapshot taken N migrations behind HEAD (see
      # api/prisma/upgrade-fixtures/baseline.json), then prove the self-host
      # upgrade path: migrate deploy from HEAD must converge it.
      - name: Restore baseline fixture
        if: steps.scope.outputs.code == '1'
        run: gunzip -c api/prisma/upgrade-fixtures/baseline.sql.gz | psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL"

      # The baseline predates the installation-channel FK. Seed the precise
      # historical shape an old direct writer could have left behind and prove
      # the migration detaches it before adding the constraint.
      - name: Seed legacy orphaned workflow installation
        if: steps.scope.outputs.code == '1'
        run: |
          psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" <<'SQL'
          INSERT INTO "organizations" ("id", "name", "updated_at")
          VALUES ('11111111-1111-4111-8111-111111111111', 'Upgrade orphan fixture', now());
          INSERT INTO "projects" ("id", "name", "organization_id", "updated_at")
          VALUES ('11111111-1111-4111-8111-111111111112', 'Upgrade orphan project', '11111111-1111-4111-8111-111111111111', now());
          INSERT INTO "teams" ("id", "name", "project_id", "updated_at")
          VALUES ('11111111-1111-4111-8111-111111111113', 'Upgrade orphan team', '11111111-1111-4111-8111-111111111112', now());
          INSERT INTO "workflow_templates" (
            "id", "organization_id", "name", "created_by_actor_type", "created_by_actor_id", "updated_at"
          ) VALUES (
            '11111111-1111-4111-8111-111111111114', '11111111-1111-4111-8111-111111111111',
            'Upgrade orphan template', 'service', 'upgrade-fixture', now()
          );
          INSERT INTO "workflow_installations" (
            "id", "workflow_template_id", "workflow_template_version", "organization_id", "project_id", "team_id",
            "channel_id", "created_by_actor_type", "created_by_actor_id", "updated_at"
          ) VALUES (
            '11111111-1111-4111-8111-111111111115', '11111111-1111-4111-8111-111111111114', 1,
            '11111111-1111-4111-8111-111111111111', '11111111-1111-4111-8111-111111111112',
            '11111111-1111-4111-8111-111111111113', '11111111-1111-4111-8111-111111111116',
            'service', 'upgrade-fixture', now()
          );
          SQL

      - name: Run migrations from HEAD
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      - name: Validate schema
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api db:validate

      - name: Smoke-test upgraded database
        if: steps.scope.outputs.code == '1'
        run: cd api && node scripts/upgrade-smoke.mjs

      - name: Report skip
        if: steps.scope.outputs.code != '1'
        run: echo "Documentation-only change — no migration or schema code to replay."

  smoke:
    name: Mock-LLM Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-smoke-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-smoke-

      - name: Install dependencies
        if: steps.scope.outputs.code == '1'
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Generate Prisma client
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # Only the worker's own dependency closure, not every package: the smoke
      # harness is a worker script. `@nessie/worker...` is Turbo's "this package
      # and everything it depends on".
      - name: Build worker dependencies
        if: steps.scope.outputs.code == '1'
        run: pnpm exec turbo run build --filter=@nessie/worker...
        env:
          # See the Type Check step: an uncached Prisma-loading tsc wave is
          # OOM-killed at Turbo's default concurrency.
          TURBO_CONCURRENCY: 4

      - name: Apply database migrations
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # End-to-end smoke: seeded org → run.execute enqueue → agentic loop →
      # builtin tool call → completion, with inference served deterministically
      # by @nessie/mock-llm (no provider tokens). Asserts terminal state, the
      # tool-call row, token-ledger events, and the run.timing TaskEvent.
      - name: Run mock-LLM smoke test
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/worker test:smoke

      - name: Report skip
        if: steps.scope.outputs.code != '1'
        run: echo "Documentation-only change — no runtime code for the smoke pipeline to exercise."

  # The same scenario as `smoke`, but through two API processes behind a
  # round-robin proxy with two worker processes claiming from one Postgres.
  # Phase 0.4 of docs/plans/2026-09-05-horizontal-scaling-statelessness.
  # Deliberately its own service container: the harness bootstraps the owner
  # account over HTTP, which only works on a database with no users.
  multi-instance-smoke:
    name: Multi-Instance Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-multi-instance-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-multi-instance-

      - name: Install dependencies
        if: steps.scope.outputs.code == '1'
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Generate Prisma client
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # The harness spawns api/dist and worker/dist as real processes, so the
      # API's closure is built here too — `smoke` only needs the worker's.
      - name: Build api and worker
        if: steps.scope.outputs.code == '1'
        run: pnpm exec turbo run build --filter=@nessie/api... --filter=@nessie/worker...
        env:
          # See the Type Check step: an uncached Prisma-loading tsc wave is
          # OOM-killed at Turbo's default concurrency.
          TURBO_CONCURRENCY: 4

      - name: Apply database migrations
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # Two instances must share one bucket: `filesystem` storage gives each
      # replica a private directory, so instance 1 writes an attachment instance 2
      # answers 404 for, and `selfHosted` mode refuses it at config load.
      # MinIO's registry images are no longer anonymously pullable. Use the same
      # pinned releases from upstream GitHub assets, checksum-verified before
      # execution. Credentials match infrastructure/compose/docker-compose.multi.yml.
      - name: Start shared object storage
        if: steps.scope.outputs.code == '1'
        run: |
          fixture="$RUNNER_TEMP/nessie-minio"
          mkdir -p "$fixture"
          curl --fail --location --retry 3 \
            https://github.com/minio/minio/releases/download/RELEASE.2025-07-23T15-54-02Z/minio_20250723155402.0.0_amd64.deb \
            --output "$fixture/minio.deb"
          curl --fail --location --retry 3 \
            https://github.com/minio/mc/releases/download/RELEASE.2025-07-21T05-28-08Z/mc.linux-amd64.RELEASE.2025-07-21T05-28-08Z \
            --output "$fixture/mc"
          echo "a6ff2d7424206c3d8be43bd5eac159e49ea57780ef1d7fb3afbe47227650a62d  $fixture/minio.deb" | sha256sum --check
          echo "ea4a453be116071ab1ccbd24eb8755bf0579649f41a7b94ab9e68571bb9f4a1e  $fixture/mc" | sha256sum --check
          dpkg-deb --extract "$fixture/minio.deb" "$fixture/server"
          chmod +x "$fixture/mc"
          MINIO_ROOT_USER=nessie MINIO_ROOT_PASSWORD=nessie-multi-instance \
            nohup "$fixture/server/usr/local/bin/minio" server "$fixture/data" --address 127.0.0.1:9010 \
            > "$fixture/server.log" 2>&1 &
          echo "$!" > "$fixture/server.pid"
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9010/minio/health/live > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "MinIO did not become live in 60s"; cat "$fixture/server.log"; exit 1
            fi
            sleep 2
          done
          "$fixture/mc" --config-dir "$fixture/client" alias set local http://127.0.0.1:9010 nessie nessie-multi-instance
          "$fixture/mc" --config-dir "$fixture/client" mb --ignore-existing local/nessie

      - name: Run multi-instance smoke
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/worker test:smoke:multi

      # All four chaos assertions pass. Kept advisory because the step turns on
      # kill timing — a 2 s SIGKILL escalation and an 8 s scripted inference —
      # which a loaded shared runner can miss; that is a flake, not a signal
      # worth blocking every PR on. A failure here is still worth reading.
      # A second database, because the harness bootstraps an owner account and the
      # run above already consumed the first one's one-time bootstrap window.
      - name: Prepare the chaos database
        if: steps.scope.outputs.code == '1'
        env:
          PGPASSWORD: nessie
        run: |
          psql -h localhost -U nessie -d postgres -c 'CREATE DATABASE nessie_multi_chaos;'
          DATABASE_URL=postgresql://nessie:nessie@localhost:5432/nessie_multi_chaos \
            pnpm --filter @nessie/api prisma:migrate:deploy

      - name: Run multi-instance chaos smoke (advisory)
        id: chaos
        if: steps.scope.outputs.code == '1'
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_multi_chaos
        run: pnpm --filter @nessie/worker test:smoke:multi -- --chaos

      - name: Summarise chaos outcome
        if: steps.scope.outputs.code == '1'
        run: |
          echo "Chaos step outcome: ${{ steps.chaos.outcome }}. Advisory only —" \
            "the kill timing it depends on can be missed on a loaded runner." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Report skip
        if: steps.scope.outputs.code != '1'
        run: echo "Documentation-only change — no runtime code for the two-instance stack to exercise."
