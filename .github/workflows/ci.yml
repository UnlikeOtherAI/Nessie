name: CI

on:
  push:
    branches: ["**"]

# On branches a new push supersedes the previous CI run, so cancel it. On main
# every push must get its OWN completed run: with a shared main group, heavy
# merge traffic cancelled main builds mid-flight (in-progress) or collapsed
# them out of the queue, so main could go hours without a single finished test
# run. Keying the main group by sha makes each merge's CI run independent —
# nothing is ever cancelled on main.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the migration lint compares committed migration
          # folders against the merge-base with the base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      - name: Build shared packages
        run: |
          pnpm --filter @nessie/schemas build
          pnpm --filter @nessie/config build
          pnpm --filter @nessie/runtime build

      - name: Typecheck all packages
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, same as the lint job: `pnpm build` is lint-gated and
          # runs `pnpm lint:migrations`, which needs a merge-base against the
          # base branch. A shallow branch checkout has no `origin/main` to
          # resolve, so every feature-branch build died before compiling.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  linux-desktop:
    name: Linux Desktop Bundle
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            desktop-file-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux desktop packages
        run: pnpm --filter @nessie/desktop run tauri:build:linux

      - name: Record artifact checksums
        run: |
          cd desktop/src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS

      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: nessie-linux-x86_64
          path: desktop/src-tauri/target/release/bundle/{deb,appimage,SHA256SUMS}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        # pgvector image (Postgres 16 + the `vector` extension) — the schema's
        # enable_pgvector migration needs it; the stock postgres:16 image fails.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      - name: Build shared packages
        # Build every shared package, not a hand-picked subset: tested packages
        # import siblings through their dist exports (e.g. memory → retrieval),
        # so a missing build breaks the run with ERR_MODULE_NOT_FOUND.
        run: pnpm --filter "./packages/*" build

      - name: Apply database migrations
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      - name: Run tests
        run: pnpm -r --if-present test

  upgrade-path:
    name: Upgrade Path
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        # Same pgvector image as the test job: the fixture replay includes the
        # enable_pgvector migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_upgrade_ci
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_upgrade_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      # Restore the checked-in snapshot taken N migrations behind HEAD (see
      # api/prisma/upgrade-fixtures/baseline.json), then prove the self-host
      # upgrade path: migrate deploy from HEAD must converge it.
      - name: Restore baseline fixture
        run: gunzip -c api/prisma/upgrade-fixtures/baseline.sql.gz | psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL"

      - name: Run migrations from HEAD
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      - name: Validate schema
        run: pnpm --filter @nessie/api db:validate

      - name: Smoke-test upgraded database
        run: cd api && node scripts/upgrade-smoke.mjs
  smoke:
    name: Mock-LLM Smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Apply database migrations
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # End-to-end smoke: seeded org → run.execute enqueue → agentic loop →
      # builtin tool call → completion, with inference served deterministically
      # by @nessie/mock-llm (no provider tokens). Asserts terminal state, the
      # tool-call row, token-ledger events, and the run.timing TaskEvent.
      - name: Run mock-LLM smoke test
        run: pnpm --filter @nessie/worker test:smoke

  navigation-e2e:
    name: Browser Safety and Navigation
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test
      # A built bundle rather than the dev server: CI has no hot-reload loop
      # to preserve, and preview serves the same code deterministically.
      NAV_E2E_ADMIN_MODE: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      # The suite runs the API in local mode, which starts the worker
      # in-process from its built dist.
      - name: Build worker
        run: pnpm --filter @nessie/worker build

      - name: Build admin bundle
        run: pnpm --filter @nessie/admin build

      - name: Apply database migrations
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # playwright-core ships the same `install` CLI as the playwright
      # package, so the repo needs no extra dependency for this.
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      # Real-browser navigation transitions: each case freezes the actual
      # animation with document.getAnimations() at 0 %, 50 % and 100 %,
      # asserts layer positions and scrollLeft numerically, and saves the
      # frames (docs/navigation/overview.md → "Verification").
      - name: Run navigation transition suite
        run: pnpm --filter @nessie/admin test:e2e:navigation

      - name: Run secret capture suite
        run: pnpm --filter @nessie/admin test:e2e:secret-capture

      - name: Upload transition frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-transition-frames
          path: e2e/screenshots/navigation
          if-no-files-found: warn

      - name: Upload secret capture frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-capture-frame
          path: admin/e2e/screenshots/secret-capture
          if-no-files-found: warn
