name: CI

on:
  push:
    branches: ["**"]

# On branches a new push supersedes the previous CI run, so cancel it. On main
# every push must get its OWN completed run: with a shared main group, heavy
# merge traffic cancelled main builds mid-flight (in-progress) or collapsed
# them out of the queue, so main could go hours without a single finished test
# run. Keying the main group by sha makes each merge's CI run independent —
# nothing is ever cancelled on main.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs deliberately declare no `needs`. Lint and Type Check used to gate the
# other six, which idled every runner for the 5m40s those two took and made a
# lint failure hide whether the tests passed at all. Both are still REQUIRED
# status checks on main, so nothing merges without them — only the ordering is
# gone, not the gate. Root `pnpm build` also keeps its own internal lint gate.
env:
  # Pin Turbo's filesystem cache so actions/cache restores exactly what Turbo
  # writes. Left alone, Turbo caches under the *git root*, which is not the
  # workspace root in every checkout layout.
  TURBO_CACHE_DIR: .turbo/cache
  # The ref `--affected` compares against. Every job checks out full history so
  # this merge-base resolves; on a shallow checkout Turbo silently treats every
  # package as changed.
  TURBO_SCM_BASE: origin/main
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the migration lint compares committed migration
          # folders against the merge-base with the base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-lint-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately NOT narrowed by scope. Lint is the cheapest job and the
      # one every other gate leans on, and the root lint scripts
      # (markdown structure, breakpoints, navigation surfaces, layers,
      # migrations) scan the whole repo rather than a package subset.
      - name: Lint all packages
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-typecheck-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      # Through Turbo rather than pnpm so the result is cached like every other
      # build. These three are the only packages whose dist the typecheck graph
      # can need ahead of time.
      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@nessie/schemas --filter=@nessie/config --filter=@nessie/runtime

      # `typecheck` keeps its `dependsOn: ["^typecheck"]` edge in turbo.json.
      # Dropping it would let 32 tsc runs go parallel, but it also removes the
      # dependency from each task's cache hash: measured on this repo, editing
      # packages/schemas left @nessie/memory's typecheck hash byte-identical, so
      # a cached pass would replay green over a breaking change. The speed comes
      # from the cache instead — unchanged packages replay in milliseconds.
      - name: Typecheck packages
        run: pnpm typecheck
        env:
          TURBO_SCOPE: ${{ steps.scope.outputs.turbo_scope }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, same as the lint job: `pnpm build` is lint-gated and
          # runs `pnpm lint:migrations`, which needs a merge-base against the
          # base branch. A shallow branch checkout has no `origin/main` to
          # resolve, so every feature-branch build died before compiling.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Still the lint-gated root build, per AGENTS.md — the gate is inside
      # `pnpm build` and must not be swapped for a raw turbo invocation.
      - name: Build all packages
        run: pnpm build
        env:
          TURBO_SCOPE: ${{ steps.scope.outputs.turbo_scope }}

  linux-desktop:
    name: Linux Desktop Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The bundle takes its frontend from https://app.nessie.works, not from a
      # local admin build, so admin/api/worker changes cannot affect it. Its
      # real inputs are desktop/, the executor/windows-provenance crate it
      # depends on by path, and assets/. A change to none of them skips the
      # 6-minute Rust build; the job still reports success, which is what a
      # required check needs.
      #
      # The scope is resolved before the toolchain, and the toolchain is set up
      # only when the bundle is actually being built. `setup-node`'s pnpm cache
      # saves the pnpm store in a post step, and on a cache miss that post step
      # FAILS the job when the store was never created — which is exactly what
      # a skipped install leaves behind. Only the runner's preinstalled Node is
      # needed to resolve the scope; ci-scope.mjs shells out to git and nothing
      # else.
      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Setup pnpm
        if: steps.scope.outputs.desktop == '1'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.scope.outputs.desktop == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux desktop dependencies
        if: steps.scope.outputs.desktop == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            desktop-file-utils

      - name: Install dependencies
        if: steps.scope.outputs.desktop == '1'
        run: pnpm install --frozen-lockfile

      - name: Build Linux desktop packages
        if: steps.scope.outputs.desktop == '1'
        run: pnpm --filter @nessie/desktop run tauri:build:linux

      - name: Record artifact checksums
        if: steps.scope.outputs.desktop == '1'
        run: |
          cd desktop/src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS

      - name: Upload Linux desktop packages
        if: steps.scope.outputs.desktop == '1'
        uses: actions/upload-artifact@v4
        with:
          name: nessie-linux-x86_64
          path: desktop/src-tauri/target/release/bundle/{deb,appimage,SHA256SUMS}

      - name: Report skip
        if: steps.scope.outputs.desktop != '1'
        run: echo "No desktop/, executor/windows-provenance/ or assets/ change — desktop bundle not rebuilt."

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (Postgres 16 + the `vector` extension) — the schema's
        # enable_pgvector migration needs it; the stock postgres:16 image fails.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-test-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Serialized before the concurrent phase on purpose: concurrent Prisma
      # generators can temporarily erase exports while sibling packages compile.
      - name: Generate Prisma client
        run: pnpm --filter @nessie/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # Through Turbo, per AGENTS.md: the `test` task's `^build` compiles each
      # suite's workspace dependencies, which is what the old hand-rolled
      # "build every package under packages/*" step was standing in for. It also
      # preserves the `@nessie/api#test` after `@nessie/worker#test` ordering
      # that turbo.json pins by hand — the worker DB suites need a database no
      # api trigger-dispatch suite is mid-flight on.
      #
      # Concurrency 4 matches what `pnpm -r` was already doing (its default), so
      # the shared-database contention profile is unchanged. `test` stays
      # `"cache": false` in turbo.json: its result depends on a database Turbo
      # cannot hash.
      - name: Run tests
        run: pnpm test
        env:
          TURBO_SCOPE: ${{ steps.scope.outputs.turbo_scope }}
          TURBO_CONCURRENCY: 4

  upgrade-path:
    name: Upgrade Path
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pgvector image as the test job: the fixture replay includes the
        # enable_pgvector migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_upgrade_ci
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_upgrade_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Install dependencies
        if: steps.scope.outputs.code == '1'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # Restore the checked-in snapshot taken N migrations behind HEAD (see
      # api/prisma/upgrade-fixtures/baseline.json), then prove the self-host
      # upgrade path: migrate deploy from HEAD must converge it.
      - name: Restore baseline fixture
        if: steps.scope.outputs.code == '1'
        run: gunzip -c api/prisma/upgrade-fixtures/baseline.sql.gz | psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL"

      - name: Run migrations from HEAD
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      - name: Validate schema
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api db:validate

      - name: Smoke-test upgraded database
        if: steps.scope.outputs.code == '1'
        run: cd api && node scripts/upgrade-smoke.mjs

      - name: Report skip
        if: steps.scope.outputs.code != '1'
        run: echo "Documentation-only change — no migration or schema code to replay."

  smoke:
    name: Mock-LLM Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-smoke-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-smoke-

      - name: Install dependencies
        if: steps.scope.outputs.code == '1'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # Only the worker's own dependency closure, not every package: the smoke
      # harness is a worker script. `@nessie/worker...` is Turbo's "this package
      # and everything it depends on".
      - name: Build worker dependencies
        if: steps.scope.outputs.code == '1'
        run: pnpm exec turbo run build --filter=@nessie/worker...

      - name: Apply database migrations
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # End-to-end smoke: seeded org → run.execute enqueue → agentic loop →
      # builtin tool call → completion, with inference served deterministically
      # by @nessie/mock-llm (no provider tokens). Asserts terminal state, the
      # tool-call row, token-ledger events, and the run.timing TaskEvent.
      - name: Run mock-LLM smoke test
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/worker test:smoke

      - name: Report skip
        if: steps.scope.outputs.code != '1'
        run: echo "Documentation-only change — no runtime code for the smoke pipeline to exercise."

  # The same scenario as `smoke`, but through two API processes behind a
  # round-robin proxy with two worker processes claiming from one Postgres.
  # Phase 0.4 of docs/plans/2026-09-05-horizontal-scaling-statelessness.
  # Deliberately its own service container: the harness bootstraps the owner
  # account over HTTP, which only works on a database with no users.
  multi-instance-smoke:
    name: Multi-Instance Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-multi-instance-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-multi-instance-

      - name: Install dependencies
        if: steps.scope.outputs.code == '1'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # The harness spawns api/dist and worker/dist as real processes, so the
      # API's closure is built here too — `smoke` only needs the worker's.
      - name: Build api and worker
        if: steps.scope.outputs.code == '1'
        run: pnpm exec turbo run build --filter=@nessie/api... --filter=@nessie/worker...

      - name: Apply database migrations
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # Two instances must share one bucket: `filesystem` storage gives each
      # replica a private directory, so instance 1 writes an attachment instance 2
      # answers 404 for, and `selfHosted` mode refuses it at config load. Not a
      # `services:` container because MinIO needs `server /data` as its command and
      # service containers cannot override one. Credentials match
      # `infrastructure/compose/docker-compose.multi.yml`.
      - name: Start shared object storage
        if: steps.scope.outputs.code == '1'
        run: |
          docker run -d --name minio \
            -p 9010:9000 \
            -e MINIO_ROOT_USER=nessie \
            -e MINIO_ROOT_PASSWORD=nessie-multi-instance \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9010/minio/health/live > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "MinIO did not become live in 60s"; docker logs minio; exit 1
            fi
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://127.0.0.1:9010 nessie nessie-multi-instance \
             && mc mb --ignore-existing local/nessie"

      - name: Run multi-instance smoke
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/worker test:smoke:multi

      # Advisory until Phase 3 (run durability) lands: the API has no SIGTERM
      # handler, so the SSE-resume assertion fails today; the other two hold and
      # are a regression net, not a green light. Flip continue-on-error off in
      # the PR that lands Phase 3 and this becomes a real gate.
      # A second database, because the harness bootstraps an owner account and the
      # run above already consumed the first one's one-time bootstrap window.
      - name: Prepare the chaos database
        if: steps.scope.outputs.code == '1'
        env:
          PGPASSWORD: nessie
        run: |
          psql -h localhost -U nessie -d postgres -c 'CREATE DATABASE nessie_multi_chaos;'
          DATABASE_URL=postgresql://nessie:nessie@localhost:5432/nessie_multi_chaos \
            pnpm --filter @nessie/api prisma:migrate:deploy

      - name: Run multi-instance chaos smoke (advisory)
        id: chaos
        if: steps.scope.outputs.code == '1'
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_multi_chaos
        run: pnpm --filter @nessie/worker test:smoke:multi -- --chaos

      - name: Summarise chaos outcome
        if: steps.scope.outputs.code == '1'
        run: |
          echo "Chaos step outcome: ${{ steps.chaos.outcome }}. Advisory only —" \
            "it becomes blocking once Phase 3 of the horizontal-scaling plan lands." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Report skip
        if: steps.scope.outputs.code != '1'
        run: echo "Documentation-only change — no runtime code for the two-instance stack to exercise."

  navigation-e2e:
    name: Navigation Transitions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nessie_test
          POSTGRES_USER: nessie
          POSTGRES_PASSWORD: nessie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://nessie:nessie@localhost:5432/nessie_test
      # A built bundle rather than the dev server: CI has no hot-reload loop
      # to preserve, and preview serves the same code deterministically.
      NAV_E2E_ADMIN_MODE: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-navigation-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-navigation-

      - name: Install dependencies
        if: steps.scope.outputs.code == '1'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # One Turbo invocation instead of three sequential pnpm builds. The suite
      # runs the API in local mode, which starts the worker in-process from its
      # built dist, and serves the admin bundle from admin/dist — both are
      # declared Turbo outputs, so an unchanged tree restores them from cache.
      - name: Build admin, api and worker
        if: steps.scope.outputs.code == '1'
        run: pnpm exec turbo run build --filter=@nessie/admin... --filter=@nessie/api... --filter=@nessie/worker...

      - name: Apply database migrations
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/api prisma:migrate:deploy

      # playwright-core ships the same `install` CLI as the playwright
      # package, so the repo needs no extra dependency for this.
      - name: Install Chromium
        if: steps.scope.outputs.code == '1'
        run: pnpm exec playwright-core install --with-deps chromium

      # Real-browser navigation transitions: each case freezes the actual
      # animation with document.getAnimations() at 0 %, 50 % and 100 %,
      # asserts layer positions and scrollLeft numerically, and saves the
      # frames (docs/navigation/overview.md → "Verification").
      - name: Run navigation transition suite
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/admin test:e2e:navigation

      # Connected mail uses a deterministic provider boundary, but renders the
      # production admin shell, mailbox and chat doorway in Chromium.
      - name: Run connected mail browser suite
        if: steps.scope.outputs.code == '1'
        run: pnpm --filter @nessie/admin test:e2e:connected-mail

      - name: Upload transition frames
        if: always() && steps.scope.outputs.code == '1'
        uses: actions/upload-artifact@v4
        with:
          name: navigation-transition-frames
          path: e2e/screenshots/navigation
          if-no-files-found: warn

      - name: Upload connected mail screenshots
        if: always() && steps.scope.outputs.code == '1'
        uses: actions/upload-artifact@v4
        with:
          name: connected-mail-screenshots
          path: e2e/screenshots/connected-mail
          if-no-files-found: warn

      - name: Report skip
        if: steps.scope.outputs.code != '1'
        run: echo "Documentation-only change — no UI or API code for the browser suites to render."
