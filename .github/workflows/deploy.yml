name: Deploy

on:
  push:
    branches: [main]

env:
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: nessie

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Compute image tags
        id: meta
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG="${COMMIT_SHA:0:7}"
          echo "api_image=${REGISTRY}/${GCP_PROJECT_ID}/${REPOSITORY}/api:${TAG}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${REGISTRY}/${GCP_PROJECT_ID}/${REPOSITORY}/worker:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        env:
          API_IMAGE: ${{ steps.meta.outputs.api_image }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.api \
            -t "$API_IMAGE" \
            -t "${REGISTRY}/${GCP_PROJECT_ID}/${REPOSITORY}/api:latest" \
            .

          docker push "$API_IMAGE"
          docker push "${REGISTRY}/${GCP_PROJECT_ID}/${REPOSITORY}/api:latest"

      - name: Build & push Worker image
        env:
          WORKER_IMAGE: ${{ steps.meta.outputs.worker_image }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.worker \
            -t "$WORKER_IMAGE" \
            -t "${REGISTRY}/${GCP_PROJECT_ID}/${REPOSITORY}/worker:latest" \
            .

          docker push "$WORKER_IMAGE"
          docker push "${REGISTRY}/${GCP_PROJECT_ID}/${REPOSITORY}/worker:latest"

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to staging
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nessie-api-staging
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.api_image }}

      - name: Deploy Worker to staging
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nessie-worker-staging
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.worker_image }}

      - name: Verify staging health
        run: |
          API_URL=$(gcloud run services describe nessie-api-staging \
            --region="${REGION}" \
            --format='value(status.url)')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health" --max-time 30)
          if [ "$STATUS" != "200" ]; then
            echo "Staging health check failed with status ${STATUS}"
            exit 1
          fi
          echo "Staging health check passed"

  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to production
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nessie-api-prod
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.api_image }}

      - name: Deploy Worker to production
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nessie-worker-prod
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.worker_image }}

      - name: Verify production health
        run: |
          API_URL=$(gcloud run services describe nessie-api-prod \
            --region="${REGION}" \
            --format='value(status.url)')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health" --max-time 30)
          if [ "$STATUS" != "200" ]; then
            echo "Production health check failed with status ${STATUS}"
            exit 1
          fi
          echo "Production health check passed"
