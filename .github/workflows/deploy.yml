name: Deploy

# Auto-deploy to the self-hosted Hetzner production host on every push to main.
# Syncs the working tree to /srv/nessie and runs the redeploy script (rebuild
# images, apply migrations, recreate containers). See docs/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Hetzner
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source to host
        # Mirror the tree with --delete so files REMOVED from the repo don't
        # linger on the host and get compiled into the image. Without it, the
        # mcp-manage extraction left stale api/src/services/mcp-*.ts on the host,
        # which broke every Docker build (tsc errors in files no longer in git).
        # rsync never deletes excluded paths, so the host-only .env is safe; the
        # Postgres/MinIO data live in named Docker volumes outside this tree, and
        # `--exclude '.env'` protects any host env file at any depth.
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '.worktrees' \
            --exclude '.turbo' \
            --exclude '*.tsbuildinfo' \
            --exclude '/*.png' \
            --exclude '/admin/*.png' \
            --exclude '.env' \
            --exclude 'infrastructure/compose/.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/nessie/"

      - name: Configure Nessie Ledger billing reader key
        env:
          LEDGER_BILLING_READ_APP_KEY_NESSIE: ${{ secrets.LEDGER_BILLING_READ_APP_KEY_NESSIE }}
        run: |
          test -n "$LEDGER_BILLING_READ_APP_KEY_NESSIE"
          printf '%s\n' "$LEDGER_BILLING_READ_APP_KEY_NESSIE" |
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /srv/nessie && bash infrastructure/compose/set-ledger-billing-reader-key.sh'

      - name: Configure Nessie Ledger application key
        env:
          LEDGER_PROXY_TOKEN: ${{ secrets.LEDGER_PROXY_TOKEN }}
        run: |
          test -n "$LEDGER_PROXY_TOKEN"
          printf '%s\n' "$LEDGER_PROXY_TOKEN" |
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /srv/nessie && bash infrastructure/compose/set-ledger-app-key.sh'

      - name: Configure Nessie DeepSignal application key
        env:
          DEEPSIGNAL_MCP_APP_KEY: ${{ secrets.DEEPSIGNAL_MCP_APP_KEY }}
        run: |
          test -n "$DEEPSIGNAL_MCP_APP_KEY"
          printf '%s\n' "$DEEPSIGNAL_MCP_APP_KEY" |
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /srv/nessie && bash infrastructure/compose/set-deepsignal-app-key.sh'

      - name: Rebuild & redeploy
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /srv/nessie && bash infrastructure/compose/redeploy.sh'
