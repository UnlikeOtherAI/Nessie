name: Deploy

# The run's own title says whether it can deploy anything, because a run that
# promotes nothing used to be indistinguishable from one that shipped: every
# `workflow_run` completion starts a Deploy, including the failed CI runs that
# the gate then declines, and all of them read "Deploy — success" in the list.
# This is evaluated from the triggering event, so it cannot name the promoted
# SHA (the gate resolves that later, under the concurrency slot); the gate's
# job summary carries that.
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && 'Deploy — manual dispatch'
    || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main')
      && format('Deploy — woken by green CI on {0}', github.event.workflow_run.head_sha)
      || format('No deploy — CI {0} on {1}', github.event.workflow_run.conclusion, github.event.workflow_run.head_branch)
  }}

# Production is woken by completed main CI, then promotes the newest commit on
# main that has passed that CI — the tip when its own CI is green, otherwise
# the newest verified ancestor. See docs/deployment.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a running deploy is never killed. This group is
# load-bearing: it is what stops one run's rsync from rewriting /srv/nessie
# while another run's build/redeploy is still reading it. GitHub keeps only the
# newest PENDING run per group, so under heavy merge traffic intermediate
# queued deploys show as "cancelled" — that is subsumption, not lost work: the
# newer run deploys a tree that already contains their commits. Failed,
# cancelled, untrusted and non-main events receive unique ignored groups, so
# they cannot cancel a pending eligible deploy before the gate skips them. The
# gate resolves the current verified main SHA *after* this slot is acquired:
# a delayed older successful CI event therefore cannot lose a newer deploy.
concurrency:
  group: >-
    ${{
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        || (github.event_name == 'workflow_run'
          && github.event.workflow_run.name == 'CI'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.repository.full_name == github.repository
          && github.event.workflow_run.head_repository.full_name == github.repository)
      )
      && 'deploy-production'
      || format('deploy-production-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  gate:
    name: Resolve verified main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      behind: ${{ steps.resolve.outputs.behind }}
      eligible: ${{ steps.resolve.outputs.eligible }}
      reason: ${{ steps.resolve.outputs.reason }}
      sha: ${{ steps.resolve.outputs.sha }}
      stalled: ${{ steps.resolve.outputs.stalled }}
    steps:
      # This checkout carries no deploy credentials. The gate script comes from
      # the trusted main branch rather than an event-provided revision.
      - name: Checkout gate policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main

      - name: Resolve current verified main SHA
        id: resolve
        env:
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy-gate.mjs >> "$GITHUB_OUTPUT"

      # What this run did, in the place somebody looks first. The decision was
      # previously visible only as a line on stderr inside the gate step, which
      # is why production being frozen for hours read as a column of green.
      - name: Record the promotion decision
        if: always() && steps.resolve.outcome == 'success'
        env:
          BEHIND: ${{ steps.resolve.outputs.behind }}
          ELIGIBLE: ${{ steps.resolve.outputs.eligible }}
          REASON: ${{ steps.resolve.outputs.reason }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          if [ "$ELIGIBLE" = "true" ]; then
            printf '### Promoting `%s`\n\n%s\n' "$SHA" "$REASON" >> "$GITHUB_STEP_SUMMARY"
            if [ "${BEHIND:-0}" != "0" ]; then
              echo "::notice title=Promoting behind the tip::$REASON"
            fi
          else
            printf '### Promoted nothing — no image was built and nothing was deployed\n\n%s\n' \
              "$REASON" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy promoted nothing::$REASON"
          fi

      # A wake-up that was never eligible (failed CI, another branch, a foreign
      # repository) is ordinary and ends green above. Getting past those checks
      # and still finding nothing verified anywhere on main is the stall that
      # froze production on 2026-09-18, and it must never again be reported as
      # a successful deploy.
      - name: Fail when nothing on main could be promoted
        if: steps.resolve.outputs.stalled == 'true'
        env:
          REASON: ${{ steps.resolve.outputs.reason }}
        run: |
          echo "::error title=Deploy stalled::$REASON"
          printf '### Deploy stalled\n\n%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Images are built HERE, on GitHub runners, never on the production host.
  # Building on the box drove its 8-core CPU to load ~340 with 0% idle for the
  # length of every deploy, and the live site timed out through Caddy while it
  # compiled — the containers were healthy, the host simply had nothing left to
  # answer with. The host now only pulls a finished image and swaps.
  build:
    name: Build ${{ matrix.name }} image
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            dockerfile: infrastructure/docker/Dockerfile.app
            build-args: ""
          - name: admin
            dockerfile: infrastructure/docker/Dockerfile.admin
            # Baked in at build time: the admin runs on its own origin and
            # talks to the API cross-origin. Must match the compose build arg
            # this replaces.
            build-args: VITE_API_BASE_URL=https://api.nessie.works
          - name: web
            dockerfile: infrastructure/docker/Dockerfile.web
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr rejects uppercase repository paths and the owner is mixed-case.
      - name: Resolve image repository
        id: repo
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/nessie" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.repo.outputs.prefix }}-${{ matrix.name }}:${{ needs.gate.outputs.sha }}
          secrets: |
            "deep_agent_read_token=${{ secrets.DEEP_AGENT_READ_TOKEN }}"
          # Scoped per image so the three matrix legs don't evict each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Named for what it ships, so the promoted SHA is readable from the checks
    # list without opening the run.
    name: Deploy ${{ needs.gate.outputs.sha }} to Hetzner
    needs: [gate, build]
    runs-on: ubuntu-latest
    # Now that the host only pulls and swaps, a deploy is minutes. Without a
    # timeout a hung ssh holds the deploy-production concurrency slot for the
    # 6h default and every deploy behind it stalls (happened 2026-09-02: the
    # remote redeploy died, the runner's ssh never noticed, and the queue was
    # blocked for hours).
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Keepalives so a silently dropped connection fails the step in ~2
          # minutes instead of hanging until the job timeout. Applies to every
          # ssh below and to rsync's ssh transport.
          {
            echo 'Host *'
            echo '  ServerAliveInterval 15'
            echo '  ServerAliveCountMax 8'
          } >> ~/.ssh/config
          # The connection-retry helper every ssh and the rsync below go
          # through. It lives here, in the workflow, and not in the checkout:
          # this job checks out the gate's verified SHA, which can be older
          # than the commit carrying this file, so a helper in `scripts/`
          # was missing from the tree on 2026-09-22 and failed the deploy.
          #
          # It retries only exit 255 — ssh's code for a connection-level
          # failure (rsync reports the same for its ssh transport) — with a
          # growing pause, and returns any other code at once, so a redeploy
          # that ran and failed is never run twice. `--stdin-var NAME`
          # re-pipes the named variable's value on every attempt, because a
          # piped stdin is consumed by the first one.
          cat > "$RUNNER_TEMP/ssh-retry.sh" <<'RETRY'
          set -u
          stdin_var=""
          if [ "${1:-}" = "--stdin-var" ]; then
            stdin_var="$2"
            shift 2
          fi
          if [ "${1:-}" = "--" ]; then
            shift
          fi
          attempts="${SSH_RETRY_ATTEMPTS:-5}"
          for attempt in $(seq 1 "$attempts"); do
            if [ -n "$stdin_var" ]; then
              printf '%s\n' "${!stdin_var}" | "$@"
              code=$?
            else
              "$@"
              code=$?
            fi
            if [ "$code" -ne 255 ]; then
              exit "$code"
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "ssh: connection failed on every attempt ($attempts)" >&2
              exit 255
            fi
            delay=$((attempt * 5))
            echo "ssh: connection failed (exit 255); retrying in ${delay}s (attempt $attempt of $attempts)" >&2
            sleep "$delay"
          done
          RETRY
          bash -n "$RUNNER_TEMP/ssh-retry.sh"

      - name: Sync source to host
        # Mirror the tree with --delete so files REMOVED from the repo don't
        # linger on the host and get compiled into the image. Without it, the
        # mcp-manage extraction left stale api/src/services/mcp-*.ts on the host,
        # which broke every Docker build (tsc errors in files no longer in git).
        # rsync never deletes excluded paths, so the host-only Nessie and
        # Infisical environment files are safe. Postgres/MinIO data live in
        # named Docker volumes outside this tree.
        run: |
          bash "$RUNNER_TEMP/ssh-retry.sh" -- rsync -az --delete \
            --exclude '.git' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '.worktrees' \
            --exclude '.turbo' \
            --exclude '*.tsbuildinfo' \
            --exclude '/*.png' \
            --exclude '/admin/*.png' \
            --exclude '.env' \
            --exclude 'infrastructure/compose/.env' \
            --exclude 'infrastructure/compose/.env.infisical' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/nessie/"

      - name: Configure Nessie Ledger application key
        env:
          LEDGER_PROXY_TOKEN: ${{ secrets.LEDGER_PROXY_TOKEN }}
        run: |
          test -n "$LEDGER_PROXY_TOKEN"
          bash "$RUNNER_TEMP/ssh-retry.sh" --stdin-var LEDGER_PROXY_TOKEN -- \
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /srv/nessie && bash infrastructure/compose/set-ledger-app-key.sh'

      - name: Configure Nessie UOA billing credentials
        env:
          UOA_BILLING_APP_KEY_NESSIE: ${{ secrets.UOA_BILLING_APP_KEY_NESSIE }}
          UOA_BILLING_ACTOR_PRIVATE_JWK_NESSIE: ${{ secrets.UOA_BILLING_ACTOR_PRIVATE_JWK_NESSIE }}
        run: |
          test -n "$UOA_BILLING_APP_KEY_NESSIE"
          test -n "$UOA_BILLING_ACTOR_PRIVATE_JWK_NESSIE"
          node infrastructure/compose/validate-uoa-billing-credentials.mjs
          UOA_BILLING_STDIN="$UOA_BILLING_APP_KEY_NESSIE"$'\n'"$UOA_BILLING_ACTOR_PRIVATE_JWK_NESSIE"
          export UOA_BILLING_STDIN
          bash "$RUNNER_TEMP/ssh-retry.sh" --stdin-var UOA_BILLING_STDIN -- \
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /srv/nessie && bash infrastructure/compose/set-uoa-billing-credentials.sh'

      - name: Configure Nessie DeepSignal application key
        env:
          DEEPSIGNAL_MCP_APP_KEY: ${{ secrets.DEEPSIGNAL_MCP_APP_KEY }}
        run: |
          test -n "$DEEPSIGNAL_MCP_APP_KEY"
          bash "$RUNNER_TEMP/ssh-retry.sh" --stdin-var DEEPSIGNAL_MCP_APP_KEY -- \
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /srv/nessie && bash infrastructure/compose/set-deepsignal-app-key.sh'

      - name: Deploy prebuilt images
        env:
          # Short-lived, repo-scoped, and valid only for this job: the host
          # uses it to pull from ghcr and nothing else. No long-lived registry
          # credential is stored on the box.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.gate.outputs.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_REPO="ghcr.io/$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')/nessie"
          # Every ssh here retries a connection-level failure (exit 255) and
          # nothing else: on 2026-09-22 the host's sshd, under a brute-force
          # wave, reset the second connection of two consecutive runs and the
          # deploy failed with the images already built. A redeploy that ran
          # and failed is never re-run.
          bash "$RUNNER_TEMP/ssh-retry.sh" --stdin-var REGISTRY_TOKEN -- \
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          bash "$RUNNER_TEMP/ssh-retry.sh" -- \
            ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd /srv/nessie && NESSIE_IMAGE_REPO='$IMAGE_REPO' NESSIE_IMAGE_TAG='$IMAGE_TAG' bash infrastructure/compose/redeploy.sh"
