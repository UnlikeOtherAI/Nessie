name: Publish Apple TestFlight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to publish after the preflight passes
        required: true
        default: both
        type: choice
        options:
          - ios
          - macos
          - both
      publish:
        description: Upload to App Store Connect (leave false for validation only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-store-testflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release source
        run: |
          pnpm lint
          pnpm exec turbo run lint typecheck test --filter=@nessie/mobile --filter=@nessie/desktop --force
          pnpm --dir mobile exec expo install --check
          pnpm --dir mobile exec expo config --type introspect --json

      - name: Record release versions
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises'

          const mobile = JSON.parse(await readFile('mobile/app.json', 'utf8')).expo
          const mac = JSON.parse(await readFile('desktop/src-tauri/tauri.appstore.conf.json', 'utf8'))
          if (!mobile.ios?.buildNumber || !mac.bundle?.macOS?.bundleVersion) {
            throw new Error('Both Apple platforms require an explicit build number.')
          }
          console.log(`iOS ${mobile.version} (${mobile.ios.buildNumber})`)
          console.log(`macOS ${mac.version} (${mac.bundle.macOS.bundleVersion})`)
          EOF

  ios:
    name: Build and submit iOS
    needs: preflight
    if: ${{ inputs.publish && (inputs.platform == 'ios' || inputs.platform == 'both') }}
    runs-on: ubuntu-latest
    environment: app-store-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trigger build and App Store Connect submission
        working-directory: mobile
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait

  macos:
    name: Build and submit macOS
    needs: preflight
    if: ${{ inputs.publish && (inputs.platform == 'macos' || inputs.platform == 'both') }}
    runs-on: macos-15
    environment: app-store-production
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_APPLICATION_SIGNING_IDENTITY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
      MACOS_APP_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_P12_BASE64 }}
      MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_SIGNING_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGNING_IDENTITY }}
      MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      NESSIE_DESKTOP_SIGNING_TEAM_ID: 59S95D279D
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install App Store signing assets
        run: |
          set -euo pipefail
          for value in \
            "$MACOS_APP_CERTIFICATE_P12_BASE64" \
            "$MACOS_APP_CERTIFICATE_PASSWORD" \
            "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" \
            "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
            "$MACOS_PROVISIONING_PROFILE_BASE64" \
            "$APPLE_SIGNING_IDENTITY" \
            "$MACOS_INSTALLER_SIGNING_IDENTITY"; do
            test -n "$value"
          done

          APP_CERTIFICATE_PATH="$RUNNER_TEMP/macos-application.p12"
          INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/macos-installer.p12"
          PROFILE_PATH="$RUNNER_TEMP/Nessie.provisionprofile"
          KEYCHAIN_PATH="$RUNNER_TEMP/nessie-app-store.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf %s "$MACOS_APP_CERTIFICATE_P12_BASE64" | base64 --decode > "$APP_CERTIFICATE_PATH"
          printf %s "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$INSTALLER_CERTIFICATE_PATH"
          printf %s "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERTIFICATE_PATH" -P "$MACOS_APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERTIFICATE_PATH" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "NESSIE_DESKTOP_APPSTORE_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build and verify the Store app
        run: |
          set -euo pipefail
          pnpm --dir desktop run tauri:build:appstore
          APP=desktop/src-tauri/target/release/bundle/macos/Nessie.app
          codesign --verify --deep --strict "$APP"
          codesign -dvv --entitlements :- "$APP"
          test ! -e "$APP/Contents/Resources/executor-runtime"

      - name: Package the Store app
        run: |
          set -euo pipefail
          APP=desktop/src-tauri/target/release/bundle/macos/Nessie.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          PACKAGE="$RUNNER_TEMP/Nessie-$VERSION-store.pkg"
          productbuild --component "$APP" /Applications --sign "$MACOS_INSTALLER_SIGNING_IDENTITY" "$PACKAGE"
          pkgutil --check-signature "$PACKAGE"
          echo "MACOS_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload macOS package to App Store Connect
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64"
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIRECTORY"
          printf %s "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          xcrun altool --validate-app --type macos --file "$MACOS_PACKAGE" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          xcrun altool --upload-app --type macos --file "$MACOS_PACKAGE" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload signed package artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nessie-macos-app-store-package
          path: ${{ runner.temp }}/Nessie-*-store.pkg
          if-no-files-found: ignore
