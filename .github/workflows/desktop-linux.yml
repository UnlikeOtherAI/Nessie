name: Desktop (Linux)

# Builds the Linux desktop artifacts and the standalone executor package, then
# proves they install: a build that is never installed is not a delivery.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and install smoke
    # The OLDEST supported Ubuntu is the build host, deliberately. Both packages
    # link against the host's glibc, libstdc++ and WebKitGTK: a package built on
    # a newer release refuses to install on an older one (unsatisfiable
    # dependencies), while one built on the oldest supported release installs on
    # every newer one. 24.04 LTS is also the oldest release carrying
    # libwebkit2gtk-4.1, which the Tauri shell requires.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The packaged executor runtime is a copy of the build host's Node, so
          # the host must run the version the bundle targets.
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-linux-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-linux-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "NESSIE_EXECUTOR_VERSION=${GITHUB_REF_NAME#desktop-v}" >> "${GITHUB_ENV}"
          fi

      - name: Shell tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build desktop bundles
        run: pnpm --filter @nessie/desktop tauri:build -- --bundles deb,appimage

      - name: Build the standalone executor package
        run: node executor/packaging/linux/build-deb.mjs

      - name: Collect artifacts and checksums
        run: |
          mkdir -p artifacts
          cp desktop/src-tauri/target/release/bundle/deb/*.deb artifacts/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          cp dist/nessie-executor_*.deb artifacts/
          cd artifacts
          sha256sum ./*.deb ./*.AppImage > SHA256SUMS
          cat SHA256SUMS

      # Repository signing of the apt metadata is out of scope here: the release
      # key's custody is not yet written down. When it is, the step signs the
      # `Release` file with the private key held in the `NESSIE_APT_SIGNING_KEY`
      # secret (and its passphrase in `NESSIE_APT_SIGNING_KEY_PASSPHRASE`) before
      # the artifacts are published.
      # - name: Sign apt repository metadata
      #   run: scripts/sign-apt-release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Install both packages
        run: |
          sudo apt-get install --yes ./artifacts/*.deb
          dpkg-query --list | grep --extended-regexp 'nessie'

      - name: The nessie:// scheme reaches the desktop entry
        run: |
          set -euo pipefail
          entry="$(grep --files-with-matches --recursive 'x-scheme-handler/nessie' /usr/share/applications)"
          echo "desktop entry declaring the scheme: ${entry}"
          # `xdg-mime query default` reads the XDG default lists, which a fresh
          # headless runner has none of; the association written by the package's
          # update-desktop-database trigger is what proves the registration, and
          # that is what a desktop session turns into the default.
          xdg-mime query default x-scheme-handler/nessie || true
          grep 'x-scheme-handler/nessie' /usr/share/applications/mimeinfo.cache

      - name: Installed files are root-owned
        run: |
          set -euo pipefail
          for path in \
            /usr/lib/nessie-executor/node \
            /usr/lib/nessie-executor/nessie-executor.cjs \
            /usr/lib/nessie-executor/manifest.json \
            /usr/lib/nessie-executor/NODE_LICENSE \
            /usr/bin/nessie-executor \
            /usr/lib/systemd/user/nessie-executor@.service; do
            owner="$(stat -c '%U' "${path}")"
            echo "${path} ${owner} $(stat -c '%a' "${path}")"
            [ "${owner}" = "root" ]
          done

      - name: The executor command answers
        run: nessie-executor status

      - name: The app opens a window
        run: |
          set -euo pipefail
          sudo apt-get install --yes xvfb xdotool
          entry="$(grep --files-with-matches --recursive 'x-scheme-handler/nessie' /usr/share/applications)"
          command="$(grep --max-count=1 '^Exec=' "${entry}" | cut --delimiter='=' --fields=2- | cut --delimiter=' ' --fields=1)"
          echo "launching ${command}"
          export DISPLAY=:99
          xvfb-run --server-num=99 --server-args='-screen 0 1280x800x24' "${command}" &
          wrapper=$!
          sleep 10
          # Alive after ten seconds, and owning a window: a shell that starts and
          # dies immediately would otherwise pass as a build success.
          kill -0 "${wrapper}"
          pgrep --full "${command}" > /dev/null
          xdotool search --name Nessie
          kill "${wrapper}"

  firecracker-conformance:
    name: Firecracker backend conformance
    # GitHub-hosted runners have no /dev/kvm: nested virtualization is not
    # offered on the standard images, so this job CANNOT run there. The `kvm`
    # label is the deployment's obligation — a self-hosted Linux runner on
    # bare metal or a nested-virtualization-capable instance, with the runner's
    # user in the `kvm` group. Until such a runner is registered this job stays
    # queued, which is the honest state; it must never be made to pass by
    # skipping, because the command and coding profiles are advertised to
    # agents on the strength of exactly this evidence.
    runs-on: [self-hosted, linux, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KVM is present and usable by this runner
        run: |
          set -euo pipefail
          # A missing or unusable /dev/kvm FAILS the job. `detectExecutorHost`
          # decides the Linux sandbox backend by opening this exact device for
          # read and write, so anything less would advertise a sandbox the
          # daemon would then refuse to start.
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
          grep --extended-regexp --count '^flags.*(vmx|svm)' /proc/cpuinfo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: executor/guest/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@nessie/executor...

      - name: The host reports the Firecracker backend
        run: |
          set -euo pipefail
          node --import tsx -e "
            import('./executor/src/host-platform.ts').then((module) => {
              const host = module.detectExecutorHost()
              console.log(JSON.stringify(host))
              if (host.sandboxBackend !== 'firecracker') {
                throw new Error('This runner has KVM but reports ' + host.sandboxBackend + '.')
              }
            })
          "

      - name: Guest builds and passes its own tests on both architectures
        working-directory: executor/guest
        run: |
          set -euo pipefail
          # `-o /dev/null`: a bare `go build ./...` writes the binary beside the
          # sources under the module name and would overwrite the checked-in
          # aarch64 guest artifact.
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./...
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./...
          go vet ./...
          go test ./...

      - name: Firecracker backend conformance
        working-directory: executor
        # The suites that gate the command and coding profiles: the backend's
        # jailer argv, its API configuration sequence, the vsock framing, and
        # the guest control and forced-egress channels. A booted-guest run is
        # added here once the Linux kernel and initrd artifacts land beside
        # these binaries; see docs/executor-protocol/overview.md §8.
        run: node --test --import tsx 'test/firecracker-*.test.ts'

      - name: The packaged hypervisor and jailer run on this host
        run: |
          set -euo pipefail
          node executor/packaging/linux/build-deb.mjs
          sudo apt-get install --yes ./dist/nessie-executor_*.deb
          # Both binaries must be root-owned and executable: that ownership is
          # the Linux trust root, and the jailer additionally needs to start as
          # root to build a chroot (Firecracker docs/jailer.md).
          for path in /usr/lib/nessie-executor/resources/firecracker/firecracker \
                      /usr/lib/nessie-executor/resources/firecracker/jailer \
                      /usr/lib/nessie-executor/resources/guest/init; do
            [ "$(stat -c '%U' "${path}")" = "root" ]
            [ "$(stat -c '%a' "${path}")" = "755" ]
          done
          /usr/lib/nessie-executor/resources/firecracker/firecracker --version
          /usr/lib/nessie-executor/resources/firecracker/jailer --version
          # The manifest records what was shipped; re-checking it here proves
          # dpkg laid down the same bytes the build verified against the
          # upstream published checksum.
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('/usr/lib/nessie-executor/resources')
          manifest = json.loads((root / 'manifest.json').read_text())
          for entry in manifest['files']:
              digest = hashlib.sha256((root / entry['path']).read_bytes()).hexdigest()
              assert digest == entry['sha256'], entry['path']
          print('resources manifest verified:', len(manifest['files']), 'files')
          PY
