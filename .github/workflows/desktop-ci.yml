name: Desktop CI

on:
  push:
    branches: ["**"]

# Same rule as CI: on branches a new push supersedes the previous run; on main
# every push gets its own completed run.
concurrency:
  group: desktop-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The desktop checks, split out of CI so a Tauri or Windows-native build — 6 and
# 13-22 minutes — no longer holds a server deploy: Deploy waits only for the CI
# workflow. Linux Desktop Bundle and Windows Native remain required status
# checks on every pull request, under the same names, and still skip with a
# success when their inputs did not change (scripts/ci-scope.mjs).
env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_SCM_BASE: origin/main
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  linux-desktop:
    name: Linux Desktop Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The bundle takes its frontend from https://app.nessie.works, not from a
      # local admin build, so admin/api/worker changes cannot affect it. Its
      # real inputs are desktop/, the executor/windows-provenance crate it
      # depends on by path, and assets/. A change to none of them skips the
      # 6-minute Rust build; the job still reports success, which is what a
      # required check needs.
      #
      # The scope is resolved before the toolchain, and the toolchain is set up
      # only when the bundle is actually being built. `setup-node`'s pnpm cache
      # saves the pnpm store in a post step, and on a cache miss that post step
      # FAILS the job when the store was never created — which is exactly what
      # a skipped install leaves behind. Only the runner's preinstalled Node is
      # needed to resolve the scope; ci-scope.mjs shells out to git and nothing
      # else.
      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Setup pnpm
        if: steps.scope.outputs.desktop == '1'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.scope.outputs.desktop == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux desktop dependencies
        if: steps.scope.outputs.desktop == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            desktop-file-utils

      - name: Install dependencies
        if: steps.scope.outputs.desktop == '1'
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Build Linux desktop packages
        if: steps.scope.outputs.desktop == '1'
        run: pnpm --filter @nessie/desktop run tauri:build:linux

      - name: Record artifact checksums
        if: steps.scope.outputs.desktop == '1'
        run: |
          cd desktop/src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS

      - name: Upload Linux desktop packages
        if: steps.scope.outputs.desktop == '1'
        uses: actions/upload-artifact@v4
        with:
          name: nessie-linux-x86_64
          path: desktop/src-tauri/target/release/bundle/{deb,appimage,SHA256SUMS}

      - name: Report skip
        if: steps.scope.outputs.desktop != '1'
        run: echo "No desktop/, executor/windows-provenance/ or assets/ change — desktop bundle not rebuilt."

  windows-native:
    name: Windows Native
    runs-on: windows-latest
    env:
      WIX_VERSION: "5.0.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This job always reports. A Windows-native change runs the real Windows
      # Rust suites and installer-authoring suite; every other change records a
      # successful, explicit skip so the required check does not disappear.
      - name: Determine CI scope
        id: scope
        run: node scripts/ci-scope.mjs

      # Also the release components' inputs and build numbers, which decide
      # what the Windows edge channel rebuilds after a merge.
      - name: Test Windows-native scope
        run: >-
          node --test scripts/ci-scope.test.mjs scripts/windows-native-ci.test.mjs
          scripts/release-components.test.mjs

      # Keep source verification separate from release signing. Pull requests
      # receive no signing secrets. The installers below are temporary unsigned
      # validation inputs only: this job neither signs, uploads, nor publishes
      # them; the signed release workflow remains a separate deployment gate.
      - name: Setup pnpm
        if: steps.scope.outputs.windows_native == '1'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.scope.outputs.windows_native == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version

      - name: Cache Cargo
        if: steps.scope.outputs.windows_native == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
            executor/native/target
            executor/service-windows/target
            executor/tray-windows/src-tauri/target
            executor/hyperv-bridge/target
          key: >-
            windows-native-cargo-${{ hashFiles(
              'desktop/src-tauri/Cargo.lock',
              'executor/native/Cargo.lock',
              'executor/service-windows/Cargo.lock',
              'executor/hyperv-bridge/Cargo.lock',
              'executor/tray-windows/src-tauri/Cargo.lock') }}
          restore-keys: windows-native-cargo-

      - name: Install dependencies
        if: steps.scope.outputs.windows_native == '1'
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      # Executor's dependency closure includes @nessie/db. Prisma's generated
      # client is intentionally absent after a clean install, so generate it
      # before Turbo asks that package to compile on Windows.
      - name: Generate Prisma client
        if: steps.scope.outputs.windows_native == '1'
        run: pnpm --filter @nessie/api prisma:generate

      # Tauri's generated resource manifest rejects a missing runtime directory
      # before compiling the desktop crate. Build the executor's published
      # dependency closure first, then prepare the exact unsigned runtime the
      # Rust tests inspect. Release signing is configured later in its own
      # workflow; this preparation signs nothing when no signing command exists.
      - name: Build executor bundle dependencies
        if: steps.scope.outputs.windows_native == '1'
        run: pnpm exec turbo run build --filter=@nessie/executor...

      - name: Prepare desktop executor runtime
        if: steps.scope.outputs.windows_native == '1'
        run: pnpm --dir desktop run prepare:executor-runtime

      # GitHub Actions' PowerShell wrapper only propagates the final native
      # command's exit code. Each crate gets its own step and repeats the exit
      # check, so a failure can never be hidden by a later passing Cargo test.
      - name: Test desktop Rust crate
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test executor native helper crate
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          cargo test --manifest-path executor/native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows provenance crate
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          cargo test --manifest-path executor/windows-provenance/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test shared Windows executor runtime
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          cargo test --manifest-path executor/windows-common/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test executor service crate
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          cargo test --manifest-path executor/service-windows/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Hyper-V bridge crate
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          cargo test --manifest-path executor/hyperv-bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test executor tray crate
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          cargo test --manifest-path executor/tray-windows/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows installer-authoring tests
        if: steps.scope.outputs.windows_native == '1'
        run: node --test executor/packaging/windows/msi-plan.test.mjs

      # The release workflow builds and boots the production kernel in Linux.
      # Hosted Windows runners cannot run Linux containers, so this checked-in,
      # non-bootable fixture keeps the PR job self-contained while covering the
      # real MSI's staging, WiX, install, service/tray, and uninstall paths.
      - name: Create verified executor MSI CI kernel fixture
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP 'windows-native-ci-bzImage'
          & executor/packaging/windows/create-ci-guest-kernel.ps1 -OutputPath $fixturePath

      - name: Setup Go
        if: steps.scope.outputs.windows_native == '1'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: executor/guest/go.sum

      - name: Install the WiX toolset
        if: steps.scope.outputs.windows_native == '1'
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      # The dialog set the package's UI comes from. It is a separate install
      # from the toolset, and without it `wix build` fails on the `ui:WixUI`
      # element with WIX0144 rather than on anything that names a dialog.
      - name: Install the WiX UI extension
        if: steps.scope.outputs.windows_native == '1'
        run: wix extension add --global WixToolset.UI.wixext/${{ env.WIX_VERSION }}

      - name: Enable VBScript for MSI validation
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          $capability = Get-WindowsCapability -Online -Name 'VBSCRIPT~~~~' -ErrorAction SilentlyContinue
          if ($capability -and $capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name | Out-Null
          }
          if (-not (Test-Path "$env:SystemRoot\System32\vbscript.dll")) {
            throw 'VBScript is unavailable, so WiX cannot validate the MSI on this runner.'
          }

      - name: Build unsigned Windows desktop installers
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          pnpm --dir desktop exec tauri build --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate unsigned Windows desktop MSI
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          $package = Get-ChildItem desktop/src-tauri/target/release/bundle/msi -Filter '*.msi' |
            Select-Object -First 1
          if (-not $package) { throw 'Tauri did not produce a Windows MSI' }
          wix msi validate $package.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned Windows executor MSI
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          $env:NESSIE_GUEST_KERNEL = Join-Path $env:RUNNER_TEMP 'windows-native-ci-bzImage'
          node executor/packaging/windows/build-msi.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test unsigned Windows desktop installer
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce a Windows NSIS installer' }
          & desktop/scripts/windows-installer-smoke.ps1 -InstallerPath $installer.FullName

      - name: Smoke-test unsigned Windows executor MSI
        if: steps.scope.outputs.windows_native == '1'
        shell: pwsh
        run: |
          $package = Get-ChildItem dist -Filter 'NessieExecutor_*_x64.msi' | Select-Object -First 1
          if (-not $package) { throw 'the Windows executor build did not produce an MSI' }
          & executor/packaging/windows/installer-smoke.ps1 -PackagePath $package.FullName

      - name: Report skip
        if: steps.scope.outputs.windows_native != '1'
        run: echo "No desktop/, executor/ or assets/ change — Windows-native checks not required."
