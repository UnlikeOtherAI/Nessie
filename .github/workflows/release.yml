name: Publish Direct Downloads

on:
  push:
    tags: ["v*"]

# A tag is immutable release input. A later replacement tag must never race the
# build and replace assets from an earlier run.
concurrency:
  group: direct-download-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the current main commit
        run: |
          set -euo pipefail
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Validate the tag and record shipped app versions
        id: release
        run: |
          set -euo pipefail
          node scripts/release-metadata.mjs "$GITHUB_REF_NAME" > release-metadata.json
          jq -r '"tag=\(.tag)"' release-metadata.json >> "$GITHUB_OUTPUT"
          cat release-metadata.json

      - name: Lint and typecheck the release source
        run: |
          pnpm lint
          pnpm typecheck

      - name: Test the mobile release shell
        run: pnpm exec turbo run test --filter=@nessie/mobile

  direct-distribution-credentials:
    name: Direct-distribution credential gate
    needs: preflight
    runs-on: ubuntu-latest
    environment: direct-download-release
    env:
      NESSIE_ANDROID_KEYSTORE_BASE64: ${{ secrets.NESSIE_ANDROID_KEYSTORE_BASE64 }}
      NESSIE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NESSIE_ANDROID_KEYSTORE_PASSWORD }}
      NESSIE_ANDROID_KEY_ALIAS: ${{ secrets.NESSIE_ANDROID_KEY_ALIAS }}
      NESSIE_ANDROID_KEY_PASSWORD: ${{ secrets.NESSIE_ANDROID_KEY_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Require direct-distribution credentials
        run: |
          set -euo pipefail
          required=(
            NESSIE_ANDROID_KEYSTORE_BASE64
            NESSIE_ANDROID_KEYSTORE_PASSWORD
            NESSIE_ANDROID_KEY_ALIAS
            NESSIE_ANDROID_KEY_PASSWORD
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing release configuration:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 1
          fi

  macos:
    name: macOS ${{ matrix.name }}
    needs: [preflight, direct-distribution-credentials]
    runs-on: ${{ matrix.runner }}
    environment: direct-download-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            asset: Nessie-macOS-Apple-Silicon.dmg
            artifact: release-macos-apple-silicon
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: Nessie-macOS-Intel.dmg
            artifact: release-macos-intel
    env:
      NESSIE_EXECUTOR_SIGNING_IDENTITY: ${{ vars.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
      NESSIE_DESKTOP_SIGNING_TEAM_ID: ${{ vars.MACOS_DEVELOPER_ID_TEAM_ID }}
      MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Build executor inputs
        run: |
          set -euo pipefail
          pnpm prisma:generate
          rustup target add "${{ matrix.target }}"
          pnpm exec turbo run build --filter=@nessie/executor...
          pnpm --dir desktop run prepare:executor-runtime

      - uses: ./.github/actions/setup-apple-signing

      - name: Build the Developer ID signed and notarized desktop
        run: node desktop/scripts/build-signed-macos.mjs "${{ matrix.target }}"

      - name: Stage verified desktop and Homebrew cask
        run: |
          set -euo pipefail
          mkdir release
          cp dist/desktop-macos/Nessie-* release/
          if [ "${{ matrix.target }}" = aarch64-apple-darwin ]; then
            node executor/packaging/cli/generate-app-manifests.mjs desktop "$GITHUB_REF_NAME" \
              release/Nessie-macOS-Apple-Silicon.dmg release
          fi

      - name: Upload the macOS download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
          if-no-files-found: error

  # The standalone executor and Desktop share Developer ID signing and notarization.
  macos-executor-menubar:
    name: macOS Executor menu bar ${{ matrix.name }}
    needs: [preflight, direct-distribution-credentials]
    runs-on: ${{ matrix.runner }}
    environment: direct-download-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            asset: Nessie-Executor-macOS-Apple-Silicon.dmg
            artifact: release-macos-executor-menubar-apple-silicon
    env:
      # The two names the rest of the repository already uses for these two
      # facts: executor/vm/scripts/build-signed-vm-helper.sh and
      # desktop/scripts/require-signing-team.mjs.
      NESSIE_EXECUTOR_SIGNING_IDENTITY: ${{ vars.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
      NESSIE_DESKTOP_SIGNING_TEAM_ID: ${{ vars.MACOS_DEVELOPER_ID_TEAM_ID }}
      MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v4

      # Before anything is built, and naming every variable that is absent. A
      # release that cannot be notarized is a failed release, never a quietly
      # unsigned download.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - uses: ./.github/actions/setup-apple-signing

      - name: Install native project generator
        run: brew install xcodegen

      - name: Build the executor inputs
        run: |
          set -euo pipefail
          pnpm prisma:generate
          pnpm exec turbo run build --filter=@nessie/executor...

      # --require-signed is the gate: without it a credential-less host may build
      # the labelled development image, and a release must never be able to.
      - name: Build the signed, notarized, stapled DMG
        run: node executor/packaging/macos/build-dmg.mjs --require-signed

      - name: Verify the published image independently of its build
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 1 -type f -name 'NessieExecutor_*.dmg' -print -quit)"
          test -n "$dmg"
          case "$(basename "$dmg")" in
            *UNSIGNED*|*DEVELOPMENT*)
              echo "A development image reached the release job: $dmg" >&2
              exit 1
              ;;
          esac

          # Apple's own verdict, asked again here so a change inside the build
          # script cannot be the only thing that says the image is installable.
          codesign --verify --deep --strict --verbose=2 "$dmg"
          codesign -dvv "$dmg" 2>&1 | tee dmg-signing.txt
          grep -F 'Authority=Developer ID Application:' dmg-signing.txt
          grep -F "TeamIdentifier=$NESSIE_DESKTOP_SIGNING_TEAM_ID" dmg-signing.txt
          ! grep -F 'Signature=adhoc' dmg-signing.txt
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

          # And the app inside it, on a machine that has never seen it: mounted
          # read-only, assessed, and its stapled ticket validated offline.
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          app="$(find "$mountpoint" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type exec -vv "$app"
          test -f "$app/Contents/Resources/executor-runtime/manifest.json"
          hdiutil detach "$mountpoint"

          mkdir release
          cp "$dmg" "release/${{ matrix.asset }}"

      - name: Prepare the Homebrew executor cask
        run: node executor/packaging/cli/generate-app-manifests.mjs executor "$GITHUB_REF_NAME" release/Nessie-Executor-macOS-Apple-Silicon.dmg release

      - name: Upload the executor menu bar download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
          if-no-files-found: error

  windows:
    name: Windows
    needs: [preflight, direct-distribution-credentials]
    uses: ./.github/workflows/desktop-windows.yml
    with:
      source_ref: ${{ github.ref }}
      enable_direct_updater: true
      require_signed_release: true
      run_hyperv_conformance: false
    secrets: inherit

  linux:
    name: Linux
    needs: [preflight, direct-distribution-credentials]
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            desktop-file-utils

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Build the Linux packages
        run: |
          set -euo pipefail
          pnpm prisma:generate
          pnpm exec turbo run build --filter=@nessie/executor...
          pnpm --dir desktop run prepare:executor-runtime
          pnpm --dir desktop exec tauri build --features direct-updater --bundles deb,appimage \
            --config src-tauri/tauri.direct-updater.conf.json

      - name: Verify and stage Linux downloads
        run: |
          set -euo pipefail
          deb="$(find desktop/src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          appimage="$(find desktop/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          test -s "$appimage.sig"
          dpkg-deb --info "$deb"
          "$appimage" --appimage-extract
          test -x squashfs-root/AppRun
          mkdir release
          cp "$deb" release/Nessie-Linux.deb
          cp "$appimage" release/Nessie-Linux.AppImage
          cp "$appimage.sig" release/Nessie-Linux.AppImage.sig

      - name: Upload Linux downloads
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
          if-no-files-found: error

  android:
    name: Android
    needs: [preflight, direct-distribution-credentials]
    runs-on: ubuntu-latest
    environment: direct-download-release
    env:
      NESSIE_ANDROID_KEYSTORE_BASE64: ${{ secrets.NESSIE_ANDROID_KEYSTORE_BASE64 }}
      NESSIE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NESSIE_ANDROID_KEYSTORE_PASSWORD }}
      NESSIE_ANDROID_KEY_ALIAS: ${{ secrets.NESSIE_ANDROID_KEY_ALIAS }}
      NESSIE_ANDROID_KEY_PASSWORD: ${{ secrets.NESSIE_ANDROID_KEY_PASSWORD }}
      EXPO_PUBLIC_ADMIN_URL: https://app.nessie.works
      EXPO_PUBLIC_RELEASE_CHANNEL: direct
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          deep-agent-read-token: ${{ secrets.DEEP_AGENT_READ_TOKEN }}

      - name: Build the signed Android APK locally
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/nessie-android-signing.jks"
          printf '%s' "$NESSIE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "NESSIE_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          NESSIE_ANDROID_KEYSTORE_PATH="$keystore" pnpm --dir mobile build:device:android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Nessie-Android.apk

      - name: Verify the APK and launch it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel
          script: |
            set -euo pipefail
            sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$apksigner"
            "$apksigner" verify --verbose --print-certs Nessie-Android.apk
            signer_digest="$("$apksigner" verify --print-certs Nessie-Android.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test "${signer_digest,,}" = 'b6232d205d9b191f6a9474cf899183aa313d1873e89c1ddc273a1306ff088870'
            adb install -r Nessie-Android.apk
            adb shell monkey -p com.unlikeotherai.nessie 1
            sleep 10
            adb shell pidof com.unlikeotherai.nessie

      - name: Upload the Android download
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: Nessie-Android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [preflight, macos, macos-executor-menubar, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v4

      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          name: release-macos-apple-silicon
          path: release-assets

      - name: Download Intel macOS candidate
        uses: actions/download-artifact@v4
        with:
          name: release-macos-intel
          path: release-assets

      - name: Download the executor menu bar candidates
        uses: actions/download-artifact@v4
        with:
          name: release-macos-executor-menubar-apple-silicon
          path: release-assets

      - name: Download Linux candidates
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets

      - name: Download Android candidate
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-assets

      - name: Download Windows candidates
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: windows-candidates

      - name: Stage desktop installers and checksums
        run: |
          set -euo pipefail
          setup="$(find windows-candidates -type f -name '*-setup.exe' -print -quit)"
          msi="$(find windows-candidates -type f -name 'Nessie_*.msi' ! -name 'NessieExecutor_*' -print -quit)"
          setup_signature="$(find windows-candidates -type f -name '*-setup.exe.sig' -print -quit)"
          executor_msi="$(find windows-candidates -maxdepth 1 -type f -name 'NessieExecutor_*_x64.msi' -print -quit)"
          test -n "$setup"
          test -n "$msi"
          test -n "$setup_signature"
          test -n "$executor_msi"
          # The Windows job signs every one of these or fails; only a signed
          # build of this tag reaches here.
          test "$(jq -r .signed windows-candidates/build-info.json)" = true
          cp "$setup" release-assets/Nessie-Windows-Setup.exe
          cp "$msi" release-assets/Nessie-Windows.msi
          cp "$setup_signature" release-assets/Nessie-Windows-Setup.exe.sig
          cp "$executor_msi" release-assets/Nessie-Executor-Windows.msi
          # Last gate before anything is uploaded: the executor installers are
          # present, and no asset carries the unsigned-development marker its own
          # builder would have put in the file name.
          test -f release-assets/Nessie-Executor-macOS-Apple-Silicon.dmg
          test -f release-assets/Nessie-Executor-Windows.msi
          if ls release-assets | grep -E 'UNSIGNED|DO-NOT-INSTALL'; then
            echo 'A development artifact reached the publish job.' >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum Nessie-* > SHA256SUMS
          )
          node scripts/release-metadata.mjs "$GITHUB_REF_NAME" > release-assets/metadata.json

      - name: Stage package-manager manifests
        run: |
          mkdir -p release-assets/winget
          cp -R windows-candidates/winget/. release-assets/winget/
          tar -czf release-assets/package-manager-manifests.tar.gz -C release-assets Casks winget

      - name: Create the signed desktop updater manifest
        run: |
          set -euo pipefail
          desktop_version="$(jq -r '.desktop.version' release-assets/metadata.json)"
          android_version="$(jq -r '.android.version' release-assets/metadata.json)"
          android_code="$(jq -r '.android.versionCode' release-assets/metadata.json)"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          apple_silicon_signature="$(tr -d '\r\n' < release-assets/Nessie-macOS-Apple-Silicon.app.tar.gz.sig)"
          intel_signature="$(tr -d '\r\n' < release-assets/Nessie-macOS-Intel.app.tar.gz.sig)"
          windows_signature="$(tr -d '\r\n' < release-assets/Nessie-Windows-Setup.exe.sig)"
          linux_signature="$(tr -d '\r\n' < release-assets/Nessie-Linux.AppImage.sig)"
          jq -n \
            --arg version "$desktop_version" \
            --arg notes "Nessie ${GITHUB_REF_NAME}" \
            --arg pubDate "$(date --utc --iso-8601=seconds)" \
            --arg releaseBase "$release_base" \
            --arg appleSiliconSignature "$apple_silicon_signature" \
            --arg intelSignature "$intel_signature" \
            --arg windowsSignature "$windows_signature" \
            --arg linuxSignature "$linux_signature" \
            --arg androidVersion "$android_version" \
            --argjson androidVersionCode "$android_code" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pubDate,
              platforms: {
                "darwin-aarch64": {
                  url: ($releaseBase + "/Nessie-macOS-Apple-Silicon.app.tar.gz"),
                  signature: $appleSiliconSignature
                },
                "darwin-x86_64": {
                  url: ($releaseBase + "/Nessie-macOS-Intel.app.tar.gz"),
                  signature: $intelSignature
                },
                "windows-x86_64": {
                  url: ($releaseBase + "/Nessie-Windows-Setup.exe"),
                  signature: $windowsSignature
                },
                "linux-x86_64": {
                  url: ($releaseBase + "/Nessie-Linux.AppImage"),
                  signature: $linuxSignature
                }
              },
              android: {
                version: $androidVersion,
                versionCode: $androidVersionCode,
                url: ($releaseBase + "/Nessie-Android.apk")
              }
            }' > release-assets/latest.json
          jq -e '
            .version != ""
            and (.platforms | keys == ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"])
            and (.platforms[] | (.url | startswith("https://")) and (.signature | length > 0))
            and (.android.versionCode > 0)
            and (.android.url | startswith("https://"))
          ' release-assets/latest.json

      - name: Create the release notes
        run: |
          set -euo pipefail
          desktop_version="$(jq -r '.desktop.version' release-assets/metadata.json)"
          android_version="$(jq -r '.android.version' release-assets/metadata.json)"
          android_code="$(jq -r '.android.versionCode' release-assets/metadata.json)"
          cat > release-notes.md <<EOF
          ## Direct downloads

          - **macOS:** Apple Silicon and Intel desktop DMGs are Developer ID signed, notarized and stapled.
          - **Nessie Executor for macOS:** \`Nessie-Executor-macOS-*.dmg\` is the menu bar app. It is Developer ID signed, notarized and stapled: open it, drag it to Applications, and it runs with no bypass of any kind.
          - **Windows:** the NSIS and MSI installers are Authenticode-signed by UnlikeOtherAI s.r.o. through Azure Artifact Signing.
          - **Nessie Executor for Windows:** \`Nessie-Executor-Windows.msi\` installs the executor service and tray for a computer without the desktop app. It is signed by the same publisher.
          - **Linux:** AppImage and Debian packages are included with SHA-256 checksums.
          - **Android:** a signed, installable APK is included. Direct APK installs can open a newer signed APK in Android's package installer; Play Store builds leave updates to Google Play.
          - **iOS:** coming soon through the App Store.

          This GitHub release is **$GITHUB_REF_NAME**. It carries desktop version **$desktop_version** and Android version **$android_version** (version code $android_code); their version tracks predate the public direct-download release series.
          Direct desktop installers check the signed `latest.json` manifest: macOS (Apple Silicon and Intel), Windows NSIS, and Linux AppImage update in-app. Windows MSI and Linux Debian packages remain package-manager managed.
          EOF

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/Nessie-* release-assets/SHA256SUMS release-assets/latest.json release-assets/package-manager-manifests.tar.gz --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Nessie $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/Nessie-* release-assets/SHA256SUMS release-assets/latest.json release-assets/package-manager-manifests.tar.gz \
              --title "Nessie $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
