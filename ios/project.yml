name: DeepWater
options:
  bundleIdPrefix: com.unlikeotherai
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DeepWater:
    type: application
    platform: iOS
    sources: [DeepWater]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.deepwater
        INFOPLIST_FILE: DeepWater/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeepWater/DeepWater.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: SwiftLint
        script: |
          export PATH="$HOME/.homebrew/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT"
          swiftlint lint --strict --quiet --config .swiftlint.yml
        basedOnDependencyAnalysis: false
  DeepWaterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DeepWaterTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DeepWater
  DeepWaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DeepWaterUITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DeepWater
schemes:
  DeepWater:
    build:
      targets:
        DeepWater: all
    test:
      targets: [DeepWaterTests, DeepWaterUITests]
      gatherCoverageData: true
